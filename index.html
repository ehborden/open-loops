// One box. One loop goes straight in; several open the check-over screen.

const quickAdd = document.getElementById('quick-add');
function growBox() { quickAdd.style.height = 'auto'; quickAdd.style.height = Math.min(quickAdd.scrollHeight + 2, 240) + 'px'; }
quickAdd.addEventListener('input', growBox);
quickAdd.addEventListener('keydown', e => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); addFromBox(); } });

function clearBox() { quickAdd.value = ''; growBox(); }

function addFromBox() {
  const items = splitLoops(quickAdd.value).map(parseLoop);
  if (!items.length) return;
  if (items.length > 1) { openReview(items); return; }
  pushUndoSnapshot('add "' + items[0].title + '"');
  addItems(items);
  save();
  clearBox();
  renderAll();
  toast('Added.');
}

// Adds checked-over items to the open list. Returns how many Today picks didn't fit.
function addItems(items) {
  let room = TODAY_LIMIT - L().tasks.filter(x => x.today && !x.done).length;
  let overCap = 0;
  const wantsToday = items.map(it => {
    if (!it.today) return false;
    if (room > 0) { room--; return true; }
    overCap++; return false;
  });
  // Added last-to-first so the first one you said ends up on top
  items.map((it, i) => [it, wantsToday[i]]).reverse().forEach(([it, today]) => {
    const t = addTask(it.title);
    if (!t) return;
    setSteps(t, newSteps(it.steps || []));
    t.size = it.size || null;
    t.energy = it.energy || null;
    t.today = today;
    if (it.type) t.type = it.type;
  });
  return overCap;
}

// ── Talk it out: the no-AI sorter ───────────────────
// Splits on new lines and on the word "next", then picks up
// time, energy, "today" and "first step is..." from what you said.
// It's rule-based, so it only catches the phrases below. The
// review step is where anything it missed gets fixed.

// "next" doesn't split when it's clearly part of the task ("the next draft", "next week")
const NEXT_KEEP_AFTER = /\b(the|a|my|this|that|your|our|his|her|their)\s*$/i;
const NEXT_KEEP_BEFORE = /^\s*(week|weekend|month|year|time|day|days|morning|afternoon|evening|night|monday|tuesday|wednesday|thursday|friday|saturday|sunday|step|steps|meeting|class|period|semester|quarter|term|unit|lesson|chapter|draft|round)\b/i;

function splitLoops(text) {
  const out = [];
  text.split('\n').forEach(line => {
    const parts = line.split(/(\bnext\b[,.:;!]?)/i);
    let buf = '';
    for (let i = 0; i < parts.length; i++) {
      if (i % 2 === 0) { buf += parts[i]; continue; }
      if (NEXT_KEEP_AFTER.test(buf) || NEXT_KEEP_BEFORE.test(parts[i + 1] || '')) { buf += parts[i]; continue; }
      out.push(buf); buf = '';
    }
    out.push(buf);
  });
  return out.map(s => s.replace(/^[-*\u2022\d.)\s]+/, '').trim()).filter(s => /[a-z0-9]/i.test(s));
}

const minBucket = n => n <= 5 ? 2 : n <= 15 ? 15 : n <= 30 ? 30 : 60;
const WORD_MINS = { two: 2, three: 2, five: 2, ten: 15, fifteen: 15, twenty: 30, 'twenty five': 30, thirty: 30, 'forty five': 60 };

const SIZE_RULES = [
  [/\b(\d+)\s*-?\s*(?:min(?:ute)?s?)\b/i, m => minBucket(+m[1])],
  [/\bhalf(?:\s+an)?\s+(?:hour|hr)\b/i, () => 30],
  [/\b(two|three|five|ten|fifteen|twenty(?: five)?|thirty|forty five)\s+min(?:ute)?s?\b/i, m => WORD_MINS[m[1].toLowerCase()]],
  [/\bquarter\s+(?:of\s+an\s+)?hour\b/i, () => 15],
  [/\b(?:\d+(?:\.\d+)?|an?|one|two|few|couple(?: of)?)\s+(?:hours?|hrs?)\b|\ball day\b|\bforever\b|\ba while\b|\bages\b|\bbig one\b|\bbig project\b/i, () => 60],
  [/\b(?:super |real |really |very )?(?:quick(?:ly)?|fast|tiny|quickie)\b|\b2 ?min\b/i, () => 2]
];

const ENERGY_RULES = [
  [/\b(?:low[- ]energy|when i'?m tired|(?:i'?m |when )?tired|brain ?dead|mindless|no brain(?:power)?|zombie mode|easy(?: one)?)\b/i, 'low'],
  [/\b(?:high[- ]energy|(?:i )?need to be fresh|when i'?m fresh|fresh|need(?:s)? (?:to )?focus|deep work|(?:it'?s|that'?s|this is|really) hard|brain ?power|lots of energy)\b/i, 'high'],
  [/\b(?:some energy|medium energy|medium|moderate)\b/i, 'med']
];

const TODAY_RE = /\b(today|tonight|this (?:morning|afternoon|evening)|asap|urgent(?:ly)?|right away)\b/i;
const STEP_RE = /[,.;]?\s*\b(?:(?:the|my)\s+)?(?:first\s+step(?:\s+is|\s+would\s+be|\s+will\s+be)?|start\s+(?:by|with)|step\s+one(?:\s+is)?)\s*[:,-]?\s*/i;
const LEAD_JUNK = /^(?:um+|uh+|so|okay|ok|and|also|then|oh|like|i need to|i have to|i've got to|i got to|i gotta|gotta|need to|have to|i should|i want to|remember to|don't forget to|dont forget to)\b[\s,.]*/i;
const TRAIL_JUNK = /[\s,.;:!-]*\b(?:and|that'?s|that|it'?s|it(?: will| should)? takes?|(?<=[,;:.]\s*)it|this|which(?: is)?|will(?: take)?|that'?ll(?: take)?|it'?ll(?: take)?|takes?|should(?: take)?|is|be|like|about|maybe|probably|only|just|when|i'?m|so|gonna(?: take| be)?|going to(?: take| be)?|needs?|i need|and i need|of)\s*$/i;

function tidy(s) {
  s = s.replace(/\s+/g, ' ').replace(/\s+([,.;:!?])/g, '$1').replace(/([,;:])[,;:\s]+/g, '$1 ').trim();
  let prev;
  do { prev = s; s = s.replace(LEAD_JUNK, '').replace(TRAIL_JUNK, '').replace(/^[\s,.;:!-]+|[\s,;:-]+$/g, '').trim(); } while (s !== prev);
  return s.replace(/\.$/, '');
}

const capFirst = s => s ? s[0].toUpperCase() + s.slice(1) : s;

// "steps" starts a step list only when it's clearly a cue ("steps, ...", "steps are", or a "then" follows),
// so "fix the porch steps" stays a plain task
const STEPS_KEEP_AFTER = /\b(?:the|my|a|front|back|porch|stair|these|those|some|few|two|three|\d+)\s*$/i;

function findStepsCue(s) {
  const re = /\bsteps\b/gi;
  let m;
  while ((m = re.exec(s))) {
    const before = s.slice(0, m.index), after = s.slice(m.index + m[0].length);
    if (STEPS_KEEP_AFTER.test(before)) continue;
    if (/^\s*(?:are\b|is\b|[:,.;-])/i.test(after) || /\bthen\b/i.test(after)) {
      return { index: m.index, rest: after.replace(/^\s*(?:are\b|is\b)?\s*[:,.;-]?\s*/i, '') };
    }
  }
  return null;
}

const splitThen = text => text.split(/[\s,;.]*\b(?:and\s+)?then\b[\s,;:.]*/i).map(x => capFirst(tidy(x))).filter(Boolean);

function parseLoop(raw) {
  const item = { title: '', steps: [], size: null, energy: null, today: false };
  let s = raw;
  const cue = findStepsCue(s);
  if (cue) { item.steps = splitThen(cue.rest); s = s.slice(0, cue.index); }
  else {
    const sm = s.match(STEP_RE);
    if (sm) { item.steps = splitThen(s.slice(sm.index + sm[0].length)); s = s.slice(0, sm.index); }
  }
  if (TODAY_RE.test(s)) { item.today = true; s = s.replace(TODAY_RE, ' '); }
  for (const [re, val] of SIZE_RULES) {
    const m = s.match(re);
    if (m) { item.size = val(m); s = s.replace(re, ' '); break; }
  }
  for (const [re, val] of ENERGY_RULES) {
    if (re.test(s)) { item.energy = val; s = s.replace(re, ' '); break; }
  }
  item.title = capFirst(tidy(s)) || capFirst(raw.trim());
  return item;
}



// \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550
//  AI (Claude)
//  Optional. Uses your own Claude API key, saved only in this
//  browser (never in a backup or synced to GitHub). Only the
//  text you choose to send goes to Anthropic.
// \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550

const AI_KEY = 'openloops_ai';
const AI_MODELS = { 'claude-haiku-5-5': 'Claude Haiku 5.5 (cheapest, fine for most dumps)', 'claude-opus-5-5': 'Claude Opus 5.5 (best results, costs more)' };
const AI_DEFAULT_MODEL = 'claude-haiku-5-5';

function loadAi() {
  try { return JSON.parse(localStorage.getItem(AI_KEY)) || {}; } catch { return {}; }
}
let ai = loadAi();
function aiOn() { return !!ai.key; }

const FIRST_STEP = 'the smallest first physical action, so small it feels silly and takes under 2 minutes (e.g. "open the email thread", "find the form")';

const SIZE_ENERGY = `- size: how long the whole task takes: "2" (2 minutes), "15", "30", or "60" (an hour or more). Use what they said; otherwise make your best guess.
- energy: "low" (can do it tired), "med", or "high" (needs a fresh, focused brain). Use what they said; otherwise make your best guess.`;

const EXTRACT_SYSTEM = `You turn a spoken brain dump into a list of open loops (tasks) for a personal task app. The text was dictated, so expect run-on sentences, filler words, and transcription mistakes.

Splitting: the word "next" said between tasks means a new loop starts, and line breaks also separate loops. When they don't say "next", split on natural task boundaries. Don't merge separate tasks. If you're unsure whether something is a task, include it.

For each loop:
- title: a short name in the person's own words. Drop filler ("um", "I need to", "I gotta") and the time/energy/today/steps remarks, but keep their phrasing. Don't add details they didn't say.
- steps: if they listed steps for this loop (usually after the word "steps", with "then" between them), return those, in order and in their words. Otherwise return exactly one step: ${FIRST_STEP}. If they said a first step, use theirs. Don't make up extra steps.
${SIZE_ENERGY}
- today: true only if they said it's for today, tonight, urgent, or ASAP.`;

const BREAK_SYSTEM = `You help someone break a task they're putting off into small steps. Return 3 to 5 steps in order, or just 1 or 2 if the task is already small. The first step is ${FIRST_STEP}. Each step is a short, concrete action in plain words, about 10 words at most. Leave out steps they've already done.`;

const SIZE_ENERGY_SCHEMA = {
  size: { type: 'string', enum: ['2', '15', '30', '60'] },
  energy: { type: 'string', enum: ['low', 'med', 'high'] }
};
const STEP_LIST = { type: 'array', items: { type: 'string' } };
const listSchema = (props, required) => ({
  type: 'object', additionalProperties: false, required: ['loops'],
  properties: { loops: { type: 'array', items: { type: 'object', additionalProperties: false, required, properties: props } } }
});
const EXTRACT_SCHEMA = listSchema(Object.assign({ title: { type: 'string' }, steps: STEP_LIST }, SIZE_ENERGY_SCHEMA, { today: { type: 'boolean' } }), ['title', 'steps', 'size', 'energy', 'today']);
// With types on the list, Claude also picks one for each loop (or none)
function extractSchema(types) {
  if (!types.length) return EXTRACT_SCHEMA;
  return listSchema(Object.assign({ title: { type: 'string' }, steps: STEP_LIST }, SIZE_ENERGY_SCHEMA,
    { today: { type: 'boolean' }, type: { type: 'string', enum: types.map(y => y.name).concat('') } }), ['title', 'steps', 'size', 'energy', 'today', 'type']);
}
function typesPrompt(types) {
  if (!types.length) return '';
  return `\n- type: the kind of work it is. Use exactly one of these names, or "" if none fit: ${types.map(y => `"${y.name}"${y.words.length ? ' (' + y.words.slice(0, 8).join(', ') + ')' : ''}`).join('; ')}.`;
}
const BREAK_SCHEMA = { type: 'object', additionalProperties: false, required: ['steps'], properties: { steps: STEP_LIST } };

async function callClaude(system, text, schema) {
  const model = AI_MODELS[ai.model] ? ai.model : AI_DEFAULT_MODEL;
  const body = {
    model, max_tokens: 16000, system,
    messages: [{ role: 'user', content: text }],
    output_config: { effort: 'low', format: { type: 'json_schema', schema } }
  };
  const headers = {
    'content-type': 'application/json',
    'x-api-key': ai.key,
    'anthropic-version': '2023-06-01',
    'anthropic-dangerous-direct-browser-access': 'true'
  };
  // If Opus declines, let the API retry on its recommended fallback model
  if (model === 'claude-opus-5-5') { body.fallbacks = 'default'; headers['anthropic-beta'] = 'server-side-fallback-2026-07-01'; }
  let res;
  try {
    res = await fetch('https://api.anthropic.com/v1/messages', { method: 'POST', headers, body: JSON.stringify(body) });
  } catch {
    throw new Error('Could not reach Claude. Check your internet connection, or use Sort it.');
  }
  if (!res.ok) {
    let detail = '';
    try { detail = (await res.json()).error?.message || ''; } catch {}
    if (res.status === 401) throw new Error('Claude did not accept the API key. Check it in Data > Settings.');
    if (res.status === 429) throw new Error('Claude is rate limiting right now. Wait a minute and try again.');
    if (res.status >= 500) throw new Error('Claude is busy or down right now. Try again in a minute, or use Sort it.');
    throw new Error(`Claude said ${res.status}${detail ? ': ' + detail : ''}`);
  }
  const msg = await res.json();
  if (msg.stop_reason === 'refusal') throw new Error('Claude declined this one. Try Sort it instead.');
  if (msg.stop_reason === 'max_tokens') throw new Error('That was too long for one go. Try sending half at a time.');
  const out = (msg.content || []).filter(b => b.type === 'text').map(b => b.text).join('');
  try { return JSON.parse(out); } catch { throw new Error('Claude sent back something unreadable. Try again.'); }
}

// Turn Claude's answer into the app's field values
function fromAi(x) {
  const texts = Array.isArray(x.steps) ? x.steps : [x.step];
  return {
    steps: texts.filter(v => typeof v === 'string').map(v => capFirst(v.trim())).filter(Boolean),
    size: SIZES.includes(Number(x.size)) ? Number(x.size) : null,
    energy: ENERGY[x.energy] ? x.energy : null
  };
}

function needAiKey() {
  if (aiOn()) return false;
  openSettings('Add your Claude API key to use AI. Until then, Add works without it.');
  return true;
}

async function withBusy(btnId, label, fn) {
  const btn = btnId && document.getElementById(btnId);
  const old = btn ? btn.textContent : '';
  if (btn) { btn.disabled = true; btn.textContent = label; }
  try { await fn(); }
  catch (e) { toast(e.message); }
  finally { if (btn && btn.isConnected) { btn.disabled = false; btn.textContent = old; } }
}

function aiExtract() {
  const text = quickAdd.value.trim();
  if (!text) { quickAdd.focus(); return; }
  if (needAiKey()) return;
  withBusy('ai-btn', 'Thinking...', async () => {
    const types = typesOf(state.current);
    const r = await callClaude(EXTRACT_SYSTEM + typesPrompt(types), text, extractSchema(types));
    const items = (r.loops || []).filter(x => x && typeof x.title === 'string' && x.title.trim())
      .map(x => {
        const ty = types.find(y => y.name === x.type);
        return Object.assign({ title: x.title.trim(), today: !!x.today }, fromAi(x), ty ? { type: ty.id } : {});
      });
    if (!items.length) { toast('Claude did not find any loops in that.'); return; }
    openReview(items);
  });
}

// Fill in details for loops that are already on the list


// Asks Claude to split one loop into small steps, then lets you check them first
function aiBreakDown(id, btnId) {
  const t = findTask(id);
  if (!t || needAiKey()) return;
  const steps = getSteps(t);
  const done = steps.filter(x => x.done).map(x => x.text);
  const left = steps.filter(x => !x.done).map(x => x.text);
  let text = 'Task: ' + t.title;
  if (done.length) text += '\nAlready done: ' + done.join('; ');
  if (left.length) text += '\nSteps they wrote so far (use or improve them): ' + left.join('; ');
  withBusy(btnId, 'Thinking...', async () => {
    const r = await callClaude(BREAK_SYSTEM, text, BREAK_SCHEMA);
    const got = fromAi(r).steps;
    if (!got.length) { toast('Claude did not come up with steps for that one.'); return; }
    _bd = { id, steps: got, replacing: left.length };
    renderBreakDown();
  });
}

let _bd = null;

function renderBreakDown() {
  const t = findTask(_bd.id);
  if (!t) return;
  openModal(`<h3>Break it down</h3>
    <p class="hint">${esc(t.title)}</p>
    ${_bd.steps.map((v, j) => `<div class="step-edit">
      <input type="text" value="${esc(v)}" aria-label="Step" oninput="_bd.steps[${j}]=this.value">
      <button class="x" title="Remove step" aria-label="Remove step" onclick="_bd.steps.splice(${j},1);renderBreakDown()">&times;</button>
    </div>`).join('')}
    <div class="review-foot">
      <button class="btn link" onclick="cancelBreakDown()">Cancel</button>
      <div class="spacer"></div>
      <button class="btn primary" onclick="commitBreakDown()">${_bd.replacing ? 'Replace steps' : 'Use these'}</button>
    </div>`, false, 'sticky');
}

function cancelBreakDown() {
  const id = _bd && _bd.id;
  _bd = null;
  closeModal();
  if (id && findTask(id)) openEditor(id);
}

function commitBreakDown() {
  const t = _bd && findTask(_bd.id);
  if (!t) { closeModal(); return; }
  pushUndoSnapshot('break down "' + t.title + '"');
  setSteps(t, getSteps(t).filter(x => x.done).concat(newSteps(_bd.steps)));
  save();
  _bd = null;
  closeModal();
  renderAll();
  openEditor(t.id);
}

// ── Review ──────────────────────────────────────────
// Everything from Sort it, AI extract, and AI fill lands here
// first, so nothing is added or changed until you say so.

let _review = null;
const _rvOpen = new Set();
const DRAFT_KEY = 'openloops_draft';

function saveDraft() {
  try {
    if (_review && _review.items.length) localStorage.setItem(DRAFT_KEY, JSON.stringify({ list: state.current, items: _review.items }));
    else localStorage.removeItem(DRAFT_KEY);
  } catch {}
  renderDraftNote();
}

function loadDraft() {
  try {
    const d = JSON.parse(localStorage.getItem(DRAFT_KEY));
    if (!d || !Array.isArray(d.items)) return null;
    const items = d.items.filter(x => x && typeof x.title === 'string').map(x => ({
      title: x.title,
      steps: (Array.isArray(x.steps) ? x.steps : []).filter(v => typeof v === 'string'),
      size: SIZES.includes(x.size) ? x.size : null,
      energy: ENERGY[x.energy] ? x.energy : null,
      today: !!x.today,
      type: typeof x.type === 'string' && /^[a-z0-9]{1,20}$/.test(x.type) ? x.type : undefined
    }));
    return items.length ? { list: LIST_NAMES.includes(d.list) ? d.list : state.current, items } : null;
  } catch { return null; }
}

function renderDraftNote() {
  const d = loadDraft();
  document.getElementById('draft-note').innerHTML = d
    ? `<button class="btn link" onclick="resumeDraft()">${d.items.length} waiting to check</button>` : '';
}

function resumeDraft() {
  const d = loadDraft();
  if (!d) return;
  if (d.list !== state.current) switchList(d.list);
  _review = { items: d.items };
  _rvOpen.clear();
  renderReview();
}

function openReview(items) {
  _rvOpen.clear();
  _review = { items: items.map(it => Object.assign({ steps: [], size: null, energy: null, today: false }, it)) };
  saveDraft();
  clearBox();
  renderReview();
}

function tagHTML(kind, value, onclick) {

// The "Add a step" line only shows once a loop has steps, or after tapping + step
function showAdd(i, it) { return it.steps.length > 0 || _rvOpen.has(i); }
function rvOpenAdd(i) {
  _rvOpen.add(i);
  renderReview();

  if (el) el.focus();
}

function renderReview() {
  const r = _review;
  const n = r.items.length;
  const rows = r.items.map((it, i) => `<div class="rv">
      <div class="rv-top">
        <input type="text" class="rv-title" value="${esc(it.title)}" aria-label="Name" oninput="rvSet(${i},'title',this.value)">

        <button class="tag ${it.today ? 'on' : 'unset'}" onclick="rvSet(${i},'today',${!it.today},true)">Today</button>

      </div>

          <button class="x" title="Remove step" aria-label="Remove step" onclick="rvStepRemove(${i},${j})">&times;</button>
        </div>`).join('')}
        ${showAdd(i, it) ? `<div class="rv-step">
          <span class="dot add">+</span>
          <input type="text" id="rv-add-${i}" placeholder="Add a step" aria-label="Add a step" onkeydown="if(event.key==='Enter'){event.preventDefault();rvAddStep(${i},this)}" onchange="rvAddStep(${i},this)">
        </div>` : ''}
      </div>
    </div>`).join('');
  openModal(`<div class="row"><h3 style="margin:0">Check these over</h3><div class="spacer"></div><span class="saved">Draft saved</span></div>
    ${rows || '<div class="empty">Nothing left.</div>'}
    <div class="review-foot">
      <button class="btn link" onclick="discardReview()">Discard all</button>
      <button class="btn link" onclick="closeModal()">Keep draft</button>
      <div class="spacer"></div>
      <button class="btn primary" ${n ? '' : 'disabled'} onclick="commitReview()">Add ${n} to ${esc(listLabel(state.current))}</button>
    </div>`, true, 'sticky');
}

function rvSet(i, field, value, rerender) {
  _review.items[i][field] = value;
  saveDraft();
  if (rerender) renderReview();
}

function rvRemove(i) { _review.items.splice(i, 1); saveDraft(); renderReview(); }
function rvStep(i, j, v) { _review.items[i].steps[j] = v; saveDraft(); }
function rvStepRemove(i, j) { _review.items[i].steps.splice(j, 1); saveDraft(); renderReview(); }

function rvInsertStep(i, j) {
  _review.items[i].steps.splice(j, 0, '');
  saveDraft();
  renderReview();
  document.getElementById(`rv-${i}-${j}`)?.focus();
}

function rvAddStep(i, input) {
  const v = input.value.trim();
  if (!v) return;
  input.value = ''; // so the box doesn't send the same step again as it's replaced
  _review.items[i].steps.push(v);
  saveDraft();
  renderReview();
  document.getElementById('rv-add-' + i)?.focus();
}

function discardReview() {
  if (!confirm('Discard these loops?')) return;
  _review = null;
  saveDraft();
  closeModal();
}

function commitReview() {
  const r = _review;
  if (!r) return;
  const items = r.items.filter(it => (it.title || '').trim()).map(it => Object.assign({}, it, { title: it.title.trim() }));
  if (!items.length) { discardReview(); return; }
  pushUndoSnapshot(`add ${items.length} loop${items.length === 1 ? '' : 's'}`);
  const overCap = addItems(items);
  save();
  _review = null;
  saveDraft();
  closeModal();
  renderAll();
  toast(overCap
    ? `${items.length} added. Today was full, so ${overCap} went to the main list.`
    : `${items.length} loop${items.length === 1 ? '' : 's'} added.`);
}

// ── Time and energy menu ────────────────────────────
// A small menu under a tag, used on the list and the check-over screen.

let _tagMenu = null;

function openTagMenu(e, kind, target) {
  e.stopPropagation();
  closeTagMenu();
  const cur = target.startsWith('rv:') ? _review.items[+target.slice(3)][kind] : (findTask(target.slice(5)) || {})[kind];

    (cur ? '<button class="clear" data-v="">Clear</button>' : '');
  menu.addEventListener('click', ev => {
    const b = ev.target.closest('button');
    if (!b) return;
    ev.stopPropagation();
    const v = b.dataset.v === '' ? null : (kind === 'size' ? Number(b.dataset.v) : b.dataset.v);
    closeTagMenu();
    setTag(kind, target, v);
  });
  document.body.appendChild(menu);
  const r = e.currentTarget.getBoundingClientRect();
  const left = Math.min(r.left, window.innerWidth - menu.offsetWidth - 8);

}

function closeTagMenu() { if (_tagMenu) { _tagMenu.remove(); _tagMenu = null; } }

function setTag(kind, target, v) {
  if (target.startsWith('rv:')) { rvSet(+target.slice(3), kind, v, true); return; }

  t[kind] = v;

function edAdd() {
  const input = document.getElementById('ed-add');

function edToggle(sid) {

// ── List rendering ──────────────────────────────────


function esc(str) {
  if (str == null) return '';
  return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}

const ARROW = '<svg width="14" height="9" viewBox="0 0 14 9" aria-hidden="true"><path d="M1.5 1.5l5.5 5.5 5.5-5.5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>';

function stepItemHTML(t, st, extra) {
  return `<div class="step-item ${st.done ? 'done' : ''}">
      <button class="step-check ${st.done ? 'on' : ''}" title="${st.done ? 'Mark not done' : 'Step done'}" onclick="toggleStep('${t.id}','${st.id}')"></button>
      <span>${esc(st.text)}</span>${extra || ''}</div>`;
}

// Bright colors go on a thick band down the left of a note; the rest of the card is almost neutral
const BRIGHT = { green: '#1faa45', blue: '#2f7de1', purple: '#8a4fd6', teal: '#10a89f', pink: '#ee5fa0', red: '#e5413c', orange: '#f58a1f', yellow: '#f2c200', gray: '#7b8494' };
const mixHex = (h, a) => {
  const n = parseInt(h.slice(1), 16), base = [247, 247, 245];
  return '#' + [n >> 16, (n >> 8) & 255, n & 255].map((v, i) => Math.round(v * a + base[i] * (1 - a)).toString(16).padStart(2, '0')).join('');
};
const PAL = Object.fromEntries(Object.entries(BRIGHT).map(([k, c]) =>
  [k, { strong: c, bg: mixHex(c, 0.035), edge: mixHex(c, 0.3), sel: mixHex(c, 0.11), track: mixHex(c, 0.22) }]));
const COLOR_NAMES = { green: 'Green', blue: 'Blue', purple: 'Purple', teal: 'Teal', pink: 'Pink', red: 'Red', orange: 'Orange', yellow: 'Yellow', gray: 'Grey' };
const palVars = k => PAL[k] ? `--n-bg:${PAL[k].bg};--n-edge:${PAL[k].edge};--n-strong:${PAL[k].strong};--n-sel:${PAL[k].sel};--n-track:${PAL[k].track}` : '';

// Types: kinds of work. A list has its own set (saved and synced with the list). Until you edit them, these are used.
const URGENT = { id: 'urgent', name: 'Urgent', color: 'orange', words: ['urgent', 'asap', 'overdue', 'deadline', 'due'] };
const IDEAS = { id: 'ideas', name: 'Ideas', color: 'yellow', words: ['idea', 'ideas', 'brainstorm', 'what if'] };
const SOMEDAY = { id: 'someday', name: 'Someday', color: 'gray', words: ['someday', 'eventually', 'one day', 'when i have time'] };
// Order matters: a loop takes the first type whose words match
const DEFAULT_TYPES = {
  Work: [
    URGENT,
    IDEAS,
    { id: 'class', name: 'Class', color: 'green', words: ['lesson', 'unit', 'student', 'students', 'class', 'grade', 'grades', 'grading', 'graded', 'quiz', 'test', 'worksheet', 'rubric', 'feedback', 'curriculum', 'classroom', 'assignment', 'homework', 'parent', 'report card'] },
    { id: 'admin', name: 'Admin', color: 'blue', words: ['email', 'reply', 'form', 'forms', 'paperwork', 'report', 'schedule', 'book', 'submit', 'meeting', 'budget', 'approve', 'invoice', 'sign', 'iep', '504', 'aide', 'coach', 'colleague', 'team', 'training', 'observation', 'counselor', 'referral', 'sub plans', 'support', 'teacher', 'teachers', 'faculty', 'staff', 'principal', 'district', 'permission', 'permissions'] },
    { id: 'projects', name: 'Projects', color: 'purple', words: ['project', 'plan', 'draft', 'outline', 'write', 'design', 'research', 'proposal', 'build', 'ongoing', 'slides'] },
    SOMEDAY
  ],
  Home: [
    URGENT,
    IDEAS,
    { id: 'chores', name: 'Chores', color: 'teal', words: ['laundry', 'dishes', 'clean', 'vacuum', 'trash', 'closet', 'tidy', 'organize', 'fold', 'mop', 'garden'] },
    { id: 'errands', name: 'Errands', color: 'pink', words: ['buy', 'pick up', 'store', 'grocery', 'groceries', 'return', 'drop off', 'post office', 'order', 'mail'] },
    { id: 'health', name: 'Health', color: 'red', words: ['dentist', 'doctor', 'appointment', 'pharmacy', 'prescription', 'exercise', 'workout', 'check-up', 'checkup', 'therapy'] },
    SOMEDAY
  ]
};
function typesOf(listName) {
  const l = state.lists[listName];
  return l && Array.isArray(l.types) ? l.types : (DEFAULT_TYPES[listName] || []);
}
const _wordRe = new Map();
function wordHit(title, w) {
  let r = _wordRe.get(w);
  if (!r) { r = new RegExp('(^|[^a-z0-9])' + w.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')); _wordRe.set(w, r); }
  return r.test(title);
}
// The type a loop has: the one it was given, else the type with the most of its words in the loop's name (a tie goes to the first)
function typeOfTask(t) {
  if (t.type === 'none') return null;
  const types = typesOf(state.current);
  if (t.type) { const x = types.find(y => y.id === t.type); if (x) return x; }
  const title = String(t.title).toLowerCase();
  let best = null, bestN = 0;
  for (const y of types) {
    const n = y.words.filter(w => wordHit(title, w)).length;
    if (n > bestN) { best = y; bestN = n; }
  }
  return best;
}
// A color picked on the note wins, then its type's color; a loop with neither stays plain
function colorOf(t) {
  if (COLORS.includes(t.color)) return t.color;
  const ty = typeOfTask(t);
  return ty && PAL[ty.color] ? ty.color : null;
}
// Bar length shows the time (short task, short bar); the fill shows steps done
const BAR_LEN = { 2: 30, 15: 50, 30: 75, 60: 100 };

function typeTagHTML(t) {
  const ty = typeOfTask(t);
  return `<button class="tag type ${ty ? '' : 'unset'}" onclick="openTypeMenu(event,'${t.id}')">${ty ? esc(ty.name) : '+ type'}</button>`;
}

function openTypeMenu(e, id) {
  e.stopPropagation();
  closeTagMenu();
  const t = findTask(id);
  if (!t) return;
  const cur = typeOfTask(t);
  const menu = document.createElement('div');
  menu.className = 'tag-menu';
  menu.innerHTML = typesOf(state.current).map(y =>
    `<button class="${cur && cur.id === y.id && !COLORS.includes(t.color) ? 'on' : ''}" data-t="${y.id}"><span class="ty-row"><i style="background:${PAL[y.color].strong}"></i>${esc(y.name)}</span></button>`).join('') +
    '<button class="clear" data-t="none">No type</button>' +
    `<div class="swatch-row">${COLORS.map(c => `<button data-c="${c}" title="${COLOR_NAMES[c]}" aria-label="${COLOR_NAMES[c]}" style="background:${PAL[c].strong}"></button>`).join('')}</div>` +
    '<button class="clear" data-edit="1">Edit types</button>';
  menu.addEventListener('click', ev => {
    const b = ev.target.closest('button');
    if (!b) return;
    ev.stopPropagation();
    closeTagMenu();
    if (b.dataset.edit) { if (_modalKind === 'editor') closeModal(); openTypesEditor(); }
    else if (b.dataset.c) setNoteType(id, 'color', b.dataset.c);
    else setNoteType(id, 'type', b.dataset.t);
  });
  document.body.appendChild(menu);
  const r = e.currentTarget.getBoundingClientRect();
  const left = Math.min(r.left, window.innerWidth - menu.offsetWidth - 8);
  const below = r.bottom + 4 + menu.offsetHeight < window.innerHeight;
  menu.style.left = Math.max(8, left) + 'px';
  menu.style.top = (below ? r.bottom + 4 : r.top - menu.offsetHeight - 4) + 'px';
  _tagMenu = menu;
}

// kind 'type': a type (or 'none'); kind 'color': just a color, no type
function setNoteType(id, kind, v) {
  const t = findTask(id);
  if (!t) return;
  pushUndoSnapshot('change type of "' + t.title + '"');
  if (kind === 'color' && COLORS.includes(v)) { t.type = 'none'; t.color = v; }
  else if (kind === 'type' && /^[a-z0-9]{1,20}$/.test(v)) { t.type = v; delete t.color; }
  else return;
  save();
  renderAll();
  if (_modalKind === 'editor' && _editing === id) renderEditor();
}

function saveTypes() {
  const out = _types.map(y => ({ id: y.id || ('t' + Math.random().toString(36).slice(2, 9)), name: y.name, color: y.color, words: String(y.words).split(',') }))
    .filter(y => y.name.trim());
  const name = state.current;
  state.lists[name].types = cleanTypes(out) || [];
  state.lists[name].typesAt = Date.now();

function taskHTML(t) {
  const steps = getSteps(t);
  const open = _openSteps.has(t.id);
  const tags = [
    `<button class="tag ${t.today ? 'on' : 'unset'}" onclick="toggleToday('${t.id}')">Today</button>`,
    typeTagHTML(t),
    tagHTML('size', t.size, `openTagMenu(event,'size','task:${t.id}')`),
    tagHTML('energy', t.energy, `openTagMenu(event,'energy','task:${t.id}')`)
  ];
  if (isSnoozed(t)) tags.push('<span class="tag static">Back tomorrow</span>');
  const age = daysSince(t.created);
  if (age >= OLD_DAYS) tags.push(`<span class="tag static old">${age} days</span>`);

  const doneN = steps.filter(x => x.done).length;
  const pct = steps.length ? Math.round(doneN / steps.length * 100) : 0;
  const ck = colorOf(t);
  let html = `<div class="task ${t.today ? 'today' : ''} ${open ? 'open' : ''}" data-id="${t.id}" data-color="${ck || ''}" style="${palVars(ck)}">
    <div class="task-top">
      <button class="check" title="Close this loop" onclick="completeTask('${t.id}')"></button>
      <div class="task-main"><div class="task-title" onclick="openEditor('${t.id}')">${esc(t.title)}</div></div>
    </div>
    <div class="tags">${tags.join('')}</div>
    <div class="bar" style="width:calc((100% - 30px) * ${(BAR_LEN[t.size] || 60) / 100})" title="${steps.length ? doneN + ' of ' + steps.length + ' steps' : 'No steps yet'}"><i style="width:${pct}%"></i></div>`;

  if (open) {
    html += '<div class="task-steps">' + steps.map(st => stepItemHTML(t, st)).join('') +
      `<input type="text" class="add-step" id="add-step-${t.id}" placeholder="Add a step" aria-label="Add a step" onkeydown="if(event.key==='Enter'){event.preventDefault();addStep('${t.id}',this)}"></div>`;
  } else if (steps.length) {
    const next = steps.find(x => !x.done);
    html += '<div class="task-steps">' + (next ? stepItemHTML(t, next) : '<div class="step-item"><span>All steps done</span></div>') + '</div>';
  }
  html += `<div class="note-foot">
      ${open ? `<button class="btn sm start-btn" onclick="startLoop('${t.id}')">Start</button>` : ''}
      <button class="more ${open ? 'open' : ''}" title="${open ? 'Hide steps' : 'Show steps'}" onclick="toggleStepsOpen('${t.id}')">${steps.length ? doneN + '/' + steps.length + ' steps' : 'Steps'}${ARROW}</button>
    </div>`;
  return html + '</div>';
}



const SORTS = [['today', 'Today first'], ['short', 'Quickest'], ['easy', 'Easiest'], ['new', 'Newest'], ['old', 'Oldest']];
// View settings that stay on this device only (not task data, not synced)
function viewPrefs() { try { return JSON.parse(localStorage.getItem('openloops_view') || '{}') || {}; } catch { return {}; } }
function saveView(patch) { try { localStorage.setItem('openloops_view', JSON.stringify(Object.assign(viewPrefs(), patch))); } catch {} }
let sortBy = SORTS.some(x => x[0] === viewPrefs().sort) ? viewPrefs().sort : 'today';
let _typesOpen = !!viewPrefs().types;

function setSort(k) {
  sortBy = k;
  saveView({ sort: k });
  renderTaskList();
}

function toggleTypes() {
  _typesOpen = !_typesOpen;
  saveView({ types: _typesOpen });
  renderTaskList();
}

function sortTasks(list) {
  const key = {
    short: t => t.size || 999,
    easy: t => ({ low: 0, med: 1, high: 2 })[t.energy] ?? 3,
    new: t => -(Date.parse(t.created) || 0),
    old: t => Date.parse(t.created) || 0
  }[sortBy];
  return list.map((t, i) => [t, i]).sort((a, b) => key(a[0]) - key(b[0]) || a[1] - b[1]).map(x => x[0]);
}

const notesHTML = list => '<div class="notes">' + list.map(taskHTML).join('') + '</div>';

// Show only one type of loop. Not saved, so a refresh always shows everything.
let _typeFilter = null;

function setTypeFilter(id) {
  const same = _typeFilter && _typeFilter.list === state.current && _typeFilter.id === id;
  _typeFilter = id && !same ? { list: state.current, id } : null;
  renderTaskList();
}

function renderTaskList() {
  const all = L().tasks.filter(t => !t.done);
  const tid = t => (typeOfTask(t) || { id: 'none' }).id;
  let f = _typeFilter && _typeFilter.list === state.current ? _typeFilter.id : null;
  if (f && !all.some(t => tid(t) === f)) { f = null; _typeFilter = null; }
  const open = f ? all.filter(t => tid(t) === f) : all;
  const snoozed = open.filter(t => isSnoozed(t) && !t.today);
  const live = open.filter(t => !isSnoozed(t) || t.today);

  let html = '';
  if (!open.length) {
    html = '<div class="empty">Nothing open.</div>';
  } else if (sortBy === 'today') {
    const today = live.filter(t => t.today);
    const quick = live.filter(t => !t.today && t.size === 2);
    const rest = live.filter(t => !t.today && t.size !== 2);
    html += `<div class="section-label">Today (${today.length}/${TODAY_LIMIT})</div>`;
    html += today.length ? notesHTML(today) : '<div class="empty">Nothing picked yet.</div>';
    if (quick.length) html += '<div class="section-label">Quick ones</div>' + notesHTML(quick);
    if (rest.length) html += '<div class="section-label">Everything else</div>' + notesHTML(rest);
  } else if (live.length) {
    html += notesHTML(sortTasks(live));
  }
  if (open.length && snoozed.length) html += '<div class="section-label">Back tomorrow</div>' + notesHTML(snoozed);
  document.getElementById('task-list').innerHTML = html;
  document.getElementById('loop-count').textContent = open.length ? `${open.length} open` : '';
  document.getElementById('sort-chips').innerHTML = SORTS.map(([k, label]) =>
    `<button class="${k === sortBy ? 'on' : ''}" onclick="setSort('${k}')">${label}</button>`).join('');

  // One chip per type that has open loops, colored like its band, with a count. They live in a box under the notes.
  const counts = new Map();
  all.forEach(t => counts.set(tid(t), (counts.get(tid(t)) || 0) + 1));
  const chips = typesOf(state.current).filter(y => counts.has(y.id)).map(y => [y.id, y.name, PAL[y.color].strong]);
  if (counts.has('none')) chips.push(['none', 'No type', '#b3b3ac']);
  const box = document.getElementById('types-box');
  box.style.display = chips.length ? '' : 'none';
  box.classList.toggle('open', _typesOpen);
  const fname = f ? (chips.find(c => c[0] === f) || [])[1] : '';
  const tog = document.getElementById('types-toggle');
  tog.innerHTML = (fname ? 'Types: ' + esc(fname) : 'Types') + ARROW;
  tog.classList.toggle('filtering', !!fname);
  document.getElementById('type-chips').innerHTML = chips.length ?
    `<button class="${f ? '' : 'on'}" onclick="setTypeFilter(null)">All</button>` +
    chips.map(([id, name, c]) => `<button class="tchip ${f === id ? 'on' : ''}" style="--c:${c}" onclick="setTypeFilter('${id}')"><i></i>${esc(name)} <span>${counts.get(id)}</span></button>`).join('') : '';
}

// ═══════════════════════════════════════════════════════
//  PICK: filters, swipe, wheel, random
// ═══════════════════════════════════════════════════════

const filters = { energy: 'any', time: 'any', today: false };
let pickMode = 'random';
let pickedId = null;

function renderFilterButtons() {
  const e = [['any', 'Any'], ['low', 'Low'], ['med', 'Some'], ['high', 'Lots']];
  document.getElementById('f-energy').innerHTML = e.map(([k, v]) =>
    `<button class="${filters.energy === k ? 'on' : ''}" onclick="setFilter('energy','${k}')">${v}</button>`).join('');
  const tm = [['any', 'Any'], ['2', '2 min'], ['15', '15 min'], ['30', '30 min'], ['60', 'An hour+']];
  document.getElementById('f-time').innerHTML = tm.map(([k, v]) =>
    `<button class="${filters.time === k ? 'on' : ''}" onclick="setFilter('time','${k}')">${v}</button>`).join('');
}

function setFilter(k, v) {
  filters[k] = v;
  renderFilterButtons();
  renderPickPool();
}

document.getElementById('f-today').addEventListener('change', e => { filters.today = e.target.checked; renderPickPool(); });

function pool() {
  const rank = { low: 1, med: 2, high: 3 };
  return activeTasks().filter(t => {
    if (filters.today && !t.today) return false;
    // Untagged tasks always stay in the pool so tagging is never required
    if (filters.energy !== 'any' && t.energy && rank[t.energy] > rank[filters.energy]) return false;
    if (filters.time !== 'any' && t.size && t.size > Number(filters.time)) return false;
    return true;
  });
}

function shuffle(a) {
  a = a.slice();
  for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
  return a;
}

let deck = [];

function renderPickPool() {
  const p = pool();
  document.getElementById('pool-count').textContent =
    p.length ? `${p.length} loop${p.length === 1 ? '' : 's'} fit right now.` : 'Nothing fits these filters. Loosen them, or add a loop.';
  const ids = new Set(p.map(t => t.id));
  deck = deck.filter(id => ids.has(id));
  p.forEach(t => { if (!deck.includes(t.id)) deck.push(t.id); });
  if (deck.length && !_deckShuffled) { deck = shuffle(deck); _deckShuffled = true; }
  renderDeck();
  drawWheel();
}
let _deckShuffled = false;

document.querySelectorAll('#pick-mode button').forEach(b => b.addEventListener('click', () => {
  pickMode = b.dataset.mode;
  document.querySelectorAll('#pick-mode button').forEach(x => { x.classList.toggle('on', x === b); x.hidden = pickMode === 'random' && x.dataset.mode === 'random'; });
  ['swipe', 'wheel', 'random'].forEach(m => document.getElementById('mode-' + m).style.display = m === pickMode ? 'block' : 'none');
  if (pickMode === 'wheel') drawWheel();
}));

// ── Swipe ───────────────────────────────────────────

function renderDeck() {
  const el = document.getElementById('deck');
  if (!deck.length) {
    el.innerHTML = '<div class="swipe-card" style="cursor:default"><div class="s">No cards. Change the filters above or capture a loop.</div></div>';
    return;
  }
  const [a, b] = deck;
  const card = (t, cls) => {
    const steps = getSteps(t), i = steps.findIndex(x => !x.done);
    let s = i < 0 ? '' : `${steps.length > 1 ? `Step ${i + 1} of ${steps.length}` : 'First step'}: ${esc(steps[i].text)}`;
    if (t.skips >= 3) s += `<br><br>Skipped ${t.skips} times. Maybe it needs a smaller first step, or maybe you can let it go.`;
    const meta = [t.size ? sizeLabel(t.size) : '', t.energy ? ENERGY[t.energy] : ''].filter(Boolean).join(' / ');
    return `<div class="swipe-card ${cls}" data-id="${t.id}" style="${palVars(colorOf(t))}">
      <div class="stamp yes">START</div><div class="stamp no">SKIP</div>
      <div class="t">${esc(t.title)}</div>
      ${meta ? `<div class="s">${meta}</div>` : ''}
      ${s ? `<div class="s">${s}</div>` : ''}
    </div>`;
  };
  el.innerHTML = (b ? card(findTask(b), 'behind') : '') + card(findTask(a), 'top');
  attachDrag(el.querySelector('.swipe-card.top'));
}

function attachDrag(cardEl) {
  let startX = 0, dx = 0, dragging = false;
  const yes = cardEl.querySelector('.stamp.yes'), no = cardEl.querySelector('.stamp.no');
  cardEl.addEventListener('pointerdown', e => {
    dragging = true; startX = e.clientX; dx = 0;
    cardEl.setPointerCapture(e.pointerId);
    cardEl.style.transition = 'none';
  });
  cardEl.addEventListener('pointermove', e => {
    if (!dragging) return;
    dx = e.clientX - startX;
    cardEl.style.transform = `translateX(${dx}px) rotate(${dx / 18}deg)`;
    yes.style.opacity = Math.max(0, Math.min(1, dx / 100));
    no.style.opacity = Math.max(0, Math.min(1, -dx / 100));
  });
  const end = () => {
    if (!dragging) return;
    dragging = false;
    if (dx > 100) flyOut(cardEl, 1, () => swipeDecide(true, true));
    else if (dx < -100) flyOut(cardEl, -1, () => swipeDecide(false, true));
    else {
      cardEl.style.transition = 'transform 0.2s';
      cardEl.style.transform = '';
      yes.style.opacity = 0; no.style.opacity = 0;
    }
  };
  cardEl.addEventListener('pointerup', end);
  cardEl.addEventListener('pointercancel', end);
}

function flyOut(cardEl, dir, cb) {
  cardEl.style.transition = 'transform 0.25s ease-in';
  cardEl.style.transform = `translateX(${dir * 600}px) rotate(${dir * 30}deg)`;
  setTimeout(cb, 220);
}

function swipeDecide(yes, animated) {
  if (!deck.length) return;
  const id = deck[0];
  if (!animated) {
    const c = document.querySelector('#deck .swipe-card.top');
    if (c) { flyOut(c, yes ? 1 : -1, () => swipeDecide(yes, true)); return; }
  }
  if (yes) {
    pickedId = id;
    renderDeck(); // put the card back after the timer starts
    startFromPick();
  } else {
    const t = findTask(id);
    if (t) { t.skips = (t.skips || 0) + 1; save(); }
    deck.push(deck.shift());
    renderDeck();
  }
}

function snoozeTop() {
  if (!deck.length) return;
  snooze(deck[0]);
}

document.addEventListener('keydown', e => {
  if (!document.getElementById('screen-pick').classList.contains('active') || pickMode !== 'swipe') return;
  if (['INPUT', 'TEXTAREA', 'SELECT'].includes(document.activeElement.tagName)) return;
  if (e.key === 'ArrowRight') swipeDecide(true);
  if (e.key === 'ArrowLeft') swipeDecide(false);
});

// ── Wheel ───────────────────────────────────────────

const WHEEL_MAX = 12;
let wheelAngle = 0, spinning = false, wheelItems = [];

function drawWheel() {
  const cv = document.getElementById('wheel');
  if (!cv) return;
  const ctx = cv.getContext('2d');
  const W = cv.width, R = W / 2 - 6;
  if (!spinning) wheelItems = shuffle(pool()).slice(0, WHEEL_MAX);
  ctx.clearRect(0, 0, W, W);
  const ink = getComputedStyle(document.body).color;
  if (!wheelItems.length) {
    ctx.fillStyle = ink; ctx.font = '28px sans-serif'; ctx.textAlign = 'center';
    ctx.fillText('Nothing to spin', W / 2, W / 2);
    return;
  }
  const n = wheelItems.length, slice = Math.PI * 2 / n;
  ctx.save();
  ctx.translate(W / 2, W / 2);
  ctx.rotate(wheelAngle);
  wheelItems.forEach((t, i) => {
    ctx.beginPath(); ctx.moveTo(0, 0);
    ctx.arc(0, 0, R, i * slice, (i + 1) * slice);
    const ck = colorOf(t);
    ctx.fillStyle = ck ? mixHex(BRIGHT[ck], 0.16) : '#ebebe8'; ctx.fill();
    ctx.lineWidth = 3; ctx.strokeStyle = '#f7f7f5'; ctx.stroke();
    // The loop's color shows as a stripe on the rim
    ctx.beginPath(); ctx.arc(0, 0, R - 8, i * slice + 0.012, (i + 1) * slice - 0.012);
    ctx.lineWidth = 16; ctx.strokeStyle = ck ? BRIGHT[ck] : '#d3d3cd'; ctx.stroke();
    ctx.save();
    ctx.rotate(i * slice + slice / 2);
    ctx.textAlign = 'right';
    ctx.fillStyle = '#2a2b27';
    ctx.font = `600 ${n > 8 ? 22 : 26}px sans-serif`;
    let label = t.title.length > 22 ? t.title.slice(0, 21) + '...' : t.title;
    ctx.fillText(label, R - 34, 9);
    ctx.restore();
  });
  ctx.restore();
  ctx.beginPath(); ctx.arc(W / 2, W / 2, 28, 0, Math.PI * 2);
  ctx.fillStyle = '#ffffff'; ctx.fill();
}

function spinWheel() {
  if (spinning || !wheelItems.length) return;
  spinning = true;
  clearPicked(document.getElementById('wheel-result'));
  document.getElementById('wheel-go').style.display = 'none';
  const n = wheelItems.length, slice = Math.PI * 2 / n;
  const target = Math.floor(Math.random() * n);
  // Pointer sits at the top (angle -PI/2). Land the middle of the target slice there.
  const desired = -Math.PI / 2 - (target * slice + slice / 2);
  const start = wheelAngle;
  let end = desired;
  while (end < start + Math.PI * 2 * 5) end += Math.PI * 2;
  const dur = 3800, t0 = performance.now();
  const step = now => {
    const p = Math.min(1, (now - t0) / dur);
    const ease = 1 - Math.pow(1 - p, 4);
    wheelAngle = start + (end - start) * ease;
    drawWheel();
    if (p < 1) requestAnimationFrame(step);
    else {
      spinning = false;
      wheelAngle = end % (Math.PI * 2);
      pickedId = wheelItems[target].id;
      showPicked(document.getElementById('wheel-result'), wheelItems[target]);
      document.getElementById('wheel-go').style.display = '';
      document.getElementById('spin-btn').textContent = 'Spin again';
      chime(660, 0.15);
    }
  };
  requestAnimationFrame(step);
}

// ── Random ──────────────────────────────────────────

// The picked loop shows as a faint card with its color on the left
function showPicked(el, t) {
  el.textContent = t.title;
  el.classList.add('picked');
  el.setAttribute('style', palVars(colorOf(t)));
}
function clearPicked(el) {
  el.textContent = '';
  el.classList.remove('picked');
  el.removeAttribute('style');
}

function randomPick() {
  const p = pool();
  const out = document.getElementById('random-result');
  if (!p.length) { clearPicked(out); out.textContent = 'Nothing fits. Loosen the filters.'; return; }
  // Today's picks get a heavier weight, older loops get a slight bump
  const weighted = [];
  p.forEach(t => {
    const w = 1 + (t.today ? 3 : 0) + Math.min(3, Math.floor(daysSince(t.created) / 7));
    for (let i = 0; i < w; i++) weighted.push(t);
  });
  const t = weighted[Math.floor(Math.random() * weighted.length)];
  pickedId = t.id;
  showPicked(out, t);
  document.getElementById('random-go').style.display = '';
}

function startFromPick() {
  if (!pickedId || !findTask(pickedId)) return;
  goFocus(pickedId, true);
}

// ═══════════════════════════════════════════════════════
//  FOCUS TIMER
//  Stores the end time (not a countdown) so a refresh or a
//  sleeping laptop doesn't lose or distort the timer.
// ═══════════════════════════════════════════════════════

const PRESETS = [5, 10, 15, 25, 45];
let focusId = null;
let chosenMinutes = 25;
let tick = null;
const CIRC = 276.46;

// Points the timer at that loop. With start, the timer begins right away.
function goFocus(id, start) {
  const tm = state.timer;
  if (tm && tm.taskId !== id) {
    const other = tm.taskId ? findTask(tm.taskId) : null;
    if (tm.finished) stopTimer(true);                 // a finished timer never blocks a new one
    else if (!other || other.done) {                  // timer with no loop: this loop joins it
      tm.taskId = id; save();
    } else if (confirm(`A timer is running for "${other.title}". Stop it and switch to this loop?`)) stopTimer(true);
    else return;
  }
  focusId = id;
  const t = findTask(id);
  if (t && t.size && !state.timer) chosenMinutes = Math.min(25, Math.max(5, t.size === 2 ? 5 : t.size));
  showFocus();
  if (start && !state.timer) startTimer();
}

function renderFocus() {
  const id = state.timer ? state.timer.taskId : focusId;
  const found = id ? findTask(id) : null;
  const t = found && !found.done ? found : null;
  document.getElementById('focus-empty').style.display = t ? 'none' : 'block';
  document.getElementById('focus-on').style.display = t ? 'block' : 'none';
  document.getElementById('ring').style.stroke = t && colorOf(t) ? PAL[colorOf(t)].strong : '';
  if (t) {
    document.getElementById('focus-title').textContent = t.title;
    const steps = getSteps(t);
    const i = steps.findIndex(x => !x.done);
    const el = document.getElementById('focus-step');
    if (i >= 0) {
      el.innerHTML = `<div class="focus-now">
          <div class="label">${steps.length > 1 ? `Step ${i + 1} of ${steps.length}` : 'Start with'}</div>
          <div class="text">${esc(steps[i].text)}</div>
          <button class="btn sm primary" onclick="toggleStep('${t.id}','${steps[i].id}')">Step done</button>
        </div>`;
    } else if (steps.length) {
      el.innerHTML = `<div class="focus-now"><div class="text">All steps done.</div>
          <button class="btn sm primary" onclick="closeLoopFromSteps('${t.id}')">Close the loop</button></div>`;
    } else {
      el.innerHTML = '';
    }
  } else {
    const sel = document.getElementById('focus-select');
    const opts = activeTasks();
    sel.innerHTML = '<option value="">Timer only, no loop</option>' +
      opts.map(o => `<option value="${o.id}">${esc(o.title)}</option>`).join('');
    sel.value = '';
    sel.onchange = () => {
      focusId = sel.value || null;
      // Picking a loop while a timer runs attaches it to that timer
      if (state.timer && focusId) { state.timer.taskId = focusId; save(); }
      updateFocusVisibility();
      renderFocus();
    };
  }
  document.getElementById('presets').innerHTML = state.timer ? '' : PRESETS.map(m =>
    `<button class="btn sm ${m === chosenMinutes ? 'primary' : ''}" onclick="chosenMinutes=${m};renderFocus()">${m === 5 ? '<span class="j">Just </span>5' : m}<span class="u"> min</span></button>`).join('');
  renderControls();
  updateClock();
  updateFocusVisibility();
}


function renderControls() {
  const c = document.getElementById('timer-controls');
  const tm = state.timer;
  const hasTask = !!(tm ? tm.taskId : focusId);
  if (!tm) {
    c.innerHTML = `<button class="btn primary big" onclick="startTimer()">Start</button>` +
      (hasTask ? `<button class="btn big" onclick="focusId=null;updateFocusVisibility();renderFocus()">Clear</button>` : '');
  } else if (tm.finished) {
    c.innerHTML = (hasTask ? `<button class="btn primary big" onclick="finishFocus(true)">I finished it</button>` : '') +
      `<button class="btn big" onclick="addMinutes(5, true)">5 more min</button>
       <button class="btn big" onclick="finishFocus(false)">Stop here</button>`;
  } else {
    c.innerHTML = `<button class="btn big" onclick="togglePause()">${tm.pausedLeft != null ? 'Resume' : 'Pause'}</button>
      <button class="btn big" onclick="addMinutes(5)">+5 min</button>` +
      (hasTask ? `<button class="btn primary big" onclick="finishFocus(true)">Close loop</button>` : '') +
      `<button class="btn big" onclick="finishFocus(false)">Stop</button>`;
  }
}

function startTimer() {
  const ms = chosenMinutes * 60000;
  state.timer = { taskId: focusId, total: ms, endsAt: Date.now() + ms, pausedLeft: null, finished: false };
  save();
  ensureTick();
  renderFocus();
  if ('Notification' in window && Notification.permission === 'default') Notification.requestPermission().catch(() => {});
}

function timeLeft() {
  const tm = state.timer;
  if (!tm) return chosenMinutes * 60000;
  if (tm.pausedLeft != null) return tm.pausedLeft;
  return Math.max(0, tm.endsAt - Date.now());
}

function togglePause() {
  const tm = state.timer;
  if (!tm) return;
  if (tm.pausedLeft != null) { tm.endsAt = Date.now() + tm.pausedLeft; tm.pausedLeft = null; }
  else tm.pausedLeft = Math.max(0, tm.endsAt - Date.now());
  save();
  renderControls();
}

function addMinutes(m, restart) {
  const tm = state.timer;
  if (!tm) return;
  if (restart) { tm.finished = false; tm.endsAt = Date.now() + m * 60000; tm.total = m * 60000; tm.pausedLeft = null; }
  else if (tm.pausedLeft != null) { tm.pausedLeft += m * 60000; tm.total += m * 60000; }
  else { tm.endsAt += m * 60000; tm.total += m * 60000; }
  save();
  ensureTick();
  renderFocus();
}

function stopTimer(silent) {
  state.timer = null;
  save();
  document.title = 'Open Loops';
  updateTimerBar();
  if (!silent) renderFocus();
}

function finishFocus(completed) {
  const id = state.timer ? state.timer.taskId : focusId;
  stopTimer(true);
  focusId = null;
  if (completed && id) { completeTask(id); return; }
  renderAll();
  if (!(id && findTask(id))) return;
  const t = findTask(id);
  const cur = currentStep(t);
  openModal(`<h3>Leave a note for future you</h3>
    <p class="hint">Where did you stop?</p>
    <input type="text" id="park-note" value="${esc(cur ? cur.text : '')}" placeholder="e.g. finish paragraph 2">
    <div class="row" style="margin-top:12px;justify-content:flex-end">
      <button class="btn" onclick="closeModal()">Skip</button>
      <button class="btn primary" onclick="insertNextStep('${id}',document.getElementById('park-note').value);closeModal();renderAll();toast('Saved. It will be waiting for you.')">Save note</button>
    </div>`);
  setTimeout(() => document.getElementById('park-note')?.focus(), 50);
}

function fmt(ms) {
  const s = Math.ceil(ms / 1000);
  return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`;
}

function updateClock() {
  const tm = state.timer;
  const left = timeLeft();
  const total = tm ? tm.total : chosenMinutes * 60000;
  document.getElementById('clock').textContent = fmt(left);
  document.getElementById('clock-sub').textContent = !tm ? 'ready' : tm.finished ? 'time is up' : tm.pausedLeft != null ? 'paused' : 'remaining';
  document.getElementById('ring').style.strokeDashoffset = CIRC * (1 - left / total);
  if (tm && !tm.finished) document.title = `${fmt(left)} ${tm.pausedLeft != null ? '(paused)' : ''} Open Loops`;
  if (tm && !tm.finished && tm.pausedLeft == null && left <= 0) timerDone();
  updateTimerBar();
}

function ensureTick() {
  if (tick) return;
  tick = setInterval(() => {
    if (!state.timer) { clearInterval(tick); tick = null; return; }
    updateClock();
  }, 250);
}

function timerDone() {
  state.timer.finished = true;
  save();
  document.title = 'Time is up! Open Loops';
  chime(523, 0.25); setTimeout(() => chime(659, 0.25), 260); setTimeout(() => chime(784, 0.4), 520);
  const t = state.timer.taskId ? findTask(state.timer.taskId) : null;
  try {
    if ('Notification' in window && Notification.permission === 'granted') {
      new Notification('Time is up', { body: t ? t.title : 'Focus session done' });
    }
  } catch {}
  renderFocus();
  if (!_cardInView) scrollToFocus();
}

// ── Sound ───────────────────────────────────────────

let _audio = null;
function chime(freq, dur) {
  if (!state.settings.sound) return;
  try {
    _audio = _audio || new (window.AudioContext || window.webkitAudioContext)();
    const o = _audio.createOscillator(), g = _audio.createGain();
    o.type = 'sine'; o.frequency.value = freq;
    g.gain.setValueAtTime(0.0001, _audio.currentTime);
    g.gain.exponentialRampToValueAtTime(0.25, _audio.currentTime + 0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, _audio.currentTime + dur);
    o.connect(g); g.connect(_audio.destination);
    o.start(); o.stop(_audio.currentTime + dur + 0.05);
  } catch {}
}

function celebrate() {
  chime(784, 0.12); setTimeout(() => chime(1047, 0.2), 110);
  toast(ENCOURAGEMENT[Math.floor(Math.random() * ENCOURAGEMENT.length)]);
  if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const cv = document.getElementById('confetti');
  const ctx = cv.getContext('2d');
  cv.width = innerWidth; cv.height = innerHeight;
  const colors = Object.values(BRIGHT);
  const parts = Array.from({ length: 120 }, () => ({
    x: innerWidth / 2, y: innerHeight * 0.6,
    vx: (Math.random() - 0.5) * 14, vy: -Math.random() * 14 - 4,
    r: Math.random() * 5 + 3, c: colors[Math.floor(Math.random() * colors.length)], a: Math.random() * 6
  }));
  const t0 = performance.now();
  const frame = now => {
    ctx.clearRect(0, 0, cv.width, cv.height);
    parts.forEach(p => {
      p.vy += 0.35; p.x += p.vx; p.y += p.vy; p.a += 0.2;
      ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.a);
      ctx.fillStyle = p.c; ctx.fillRect(-p.r, -p.r / 2, p.r * 2, p.r);
      ctx.restore();
    });
    if (now - t0 < 1800) requestAnimationFrame(frame);
    else ctx.clearRect(0, 0, cv.width, cv.height);
  };
  requestAnimationFrame(frame);
}

function winStats() {
  const done = L().tasks.filter(t => t.done).sort((a, b) => b.done.localeCompare(a.done));
  const today = todayStr();
  const dayOf = iso => todayStr(new Date(iso));
  const weekAgo = Date.now() - 7 * 86400000;
  const days = new Set(done.map(t => dayOf(t.done)));
  let streak = 0;
  const d = new Date();
  if (!days.has(todayStr(d))) d.setDate(d.getDate() - 1); // today not over yet, so the streak can still continue
  while (days.has(todayStr(d))) { streak++; d.setDate(d.getDate() - 1); }
  const start = new Date(); start.setHours(0, 0, 0, 0);
  let stepsToday = 0;
  L().tasks.forEach(t => (Array.isArray(t.steps) ? t.steps : []).forEach(x => { if (x.done && typeof x.doneAt === 'number' && x.doneAt >= start.getTime()) stepsToday++; }));
  return {
    done, today, dayOf, streak, stepsToday,
    nToday: done.filter(t => dayOf(t.done) === today).length,
    nWeek: done.filter(t => new Date(t.done).getTime() >= weekAgo).length
  };
}

function winTime(w, t) {
  const dt = new Date(t.done);
  return w.dayOf(t.done) === w.today ? dt.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' }) : dt.toLocaleDateString([], { month: 'short', day: 'numeric' });
}

function renderWins() {
  const w = winStats();
  document.getElementById('s-today').textContent = w.nToday;
  document.getElementById('s-week').textContent = w.nWeek;
  document.getElementById('s-streak').textContent = w.streak;
  const list = document.getElementById('wins-list');
  if (!w.done.length) { list.innerHTML = '<div class="empty">Nothing closed yet. Your first one goes here.</div>'; return; }
  list.innerHTML = w.done.slice(0, 50).map(t => `<div class="win"><span>${esc(t.title)}</span><time>${winTime(w, t)}</time>
      <button class="btn sm" title="Reopen" onclick="reopen('${t.id}')">Reopen</button></div>`).join('') +
    `<div class="row" style="margin-top:12px"><button class="btn sm" onclick="clearOldWins()">Clear wins older than 30 days</button></div>`;
}

// The small version on the right on a computer
function renderWinsMini() {
  if (!WIDE.matches) return;
  const w = winStats();
  const recent = w.done.slice(0, 5);
  document.getElementById('wins-mini').innerHTML = `<div class="row"><h2 style="flex:1;margin:0">Wins</h2>
      <button class="btn sm" onclick="showScreen('wins')">See all</button></div>
    <div class="stats" style="margin-top:10px">

      <div class="stat"><div class="n">${w.nWeek}</div><div class="l">last 7 days</div></div>
      <div class="stat"><div class="n">${w.streak}</div><div class="l">day streak</div></div>
    </div>
    ${w.stepsToday ? `<p class="steps-today">${w.stepsToday} step${w.stepsToday === 1 ? '' : 's'} checked off today</p>` : ''}
    <div style="margin-top:8px">${recent.length
      ? recent.map(t => `<div class="win"><span>${esc(t.title)}</span><time>${winTime(w, t)}</time></div>`).join('')
      : '<div class="empty">Nothing closed yet. Your first one goes here.</div>'}</div>`;
}

function reopen(id) {
  const t = findTask(id);
  if (!t) return;
  pushUndoSnapshot('reopen "' + t.title + '"');
  t.done = null;
  save();
  renderAll();
}

function clearOldWins() {
  const cutoff = Date.now() - 30 * 86400000;
  const n = L().tasks.filter(t => t.done && new Date(t.done).getTime() < cutoff).length;
  if (!n) { toast('Nothing older than 30 days.'); return; }
  if (!confirm(`Remove ${n} wins older than 30 days? A Backup first keeps a copy.`)) return;
  pushUndoSnapshot(`clear ${n} old wins`);
  L().tasks = L().tasks.filter(t => !(t.done && new Date(t.done).getTime() < cutoff));
  save();
  renderAll();
}
