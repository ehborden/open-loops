<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Open Loops</title>
<meta name="theme-color" content="#ecece9">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Open Loops">
<link rel="apple-touch-icon" href="icon-180.png?v=2">
<link rel="icon" type="image/png" href="icon-192.png?v=2">
<link rel="manifest" href="manifest.json">
<style>
  /* Neutral and light, green for buttons, a color on every note. Thin lines, small corners, no heavy shadows. */
  :root {
    --bg: #ecece9;
    --card: #f7f7f5;
    --field: #fbfbfa;
    --ink: #2a2b27;
    --muted: #61635b;
    --line: #d3d3ce;
    --edge: #b7b7af;
    --accent: #3a3f42;
    --accent-deep: #2b2f31;
    --hover: #e8e9e9;
    --accent-ink: #ffffff;
    --lime: #d4eb8f;
    --lime-soft: #f7fbe9;
    --green: #33872f;
    --green-bg: #e6f2e3;
    --red: #b3261e;
    --red-bg: #fbeceb;
    --amber: #8a6100;
    --amber-bg: #fbf4df;
    --shadow: 0 1px 2px rgba(42,43,39,0.04);
    --pop-shadow: 0 6px 20px rgba(42,47,34,0.10);
    color-scheme: light;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: var(--bg);
    color: var(--ink);
    font: 16px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  button, input, select, textarea { font: inherit; color: inherit; }
  .wrap { max-width: 760px; margin: 0 auto; padding: 0 16px 80px; }

  /* Header */
  header { background: var(--bg); }
  header .wrap { padding-bottom: 0; }
  .tabbar { position: sticky; top: 0; z-index: 20; background: var(--bg); border-bottom: 1px solid var(--edge); }
  .tabbar .wrap { padding-bottom: 0; }
  .head-row { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 10px; padding: 12px 0; }
  .head-r { display: flex; gap: 10px; align-items: center; justify-content: flex-end; flex-wrap: wrap; }
  .brand { font-size: 18px; font-weight: 600; letter-spacing: -0.2px; line-height: 1.15; text-align: center; }
  .brand .sub { display: block; font-size: 11px; font-weight: 400; letter-spacing: 0; color: var(--muted); margin-top: 1px; }
  .list-toggle button { font-weight: 600; padding: 4px 12px; }
  .seg.list-toggle button.on { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
  .list-toggle .count { font-weight: 400; opacity: 0.75; font-size: 12px; }
  .sync-pill.ok { color: var(--green); }
  .sync-pill.offline { color: var(--amber); }
  .sync-pill.error { color: var(--red); border-color: var(--red); }
  .sync-pill.off { color: var(--muted); }
  .spacer { flex: 1; }
  .btn[hidden], .seg button[hidden] { display: none; }
  /* Kept together on the right, so the Data menu always opens on screen when the header wraps */
  .head-actions { display: flex; gap: 10px; align-items: center; }
  @media (max-width: 760px) {
    .head-row { grid-template-columns: 1fr; gap: 8px; }
    .head-l { display: none; }
    .head-r { justify-content: space-between; }
  }
  nav.tabs { display: flex; gap: 4px; overflow-x: auto; padding: 4px 0 10px; }
  nav.tabs button {
    border: 1px solid var(--edge); background: var(--card); border-radius: 6px;
    padding: 6px 14px; cursor: pointer; white-space: nowrap;
  }
  nav.tabs button.active { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }

  .btn {
    border: 1px solid var(--edge); background: var(--card); border-radius: 6px;
    padding: 8px 14px; cursor: pointer;
  }
  .btn:hover { border-color: var(--accent); }
  .btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 600; }
  .btn.big { padding: 14px 22px; font-size: 18px; border-radius: 8px; }
  .btn.sm { padding: 4px 10px; font-size: 13px; border-radius: 8px; }
  .btn.danger { color: var(--red); }
  .btn[disabled] { opacity: 0.35; pointer-events: none; }

  .menu { position: relative; }
  .menu-list {
    position: absolute; right: 0; top: calc(100% + 6px); min-width: 200px;
    background: var(--card); border: 1px solid var(--edge); border-radius: 8px;
    box-shadow: var(--shadow); padding: 6px; display: none; z-index: 30;
  }
  .menu-list.open { display: block; }
  .menu-list button, .menu-list label {
    display: block; width: 100%; text-align: left; background: none; border: none;
    padding: 8px 12px; border-radius: 8px; cursor: pointer; font-size: 14px;
  }
  .menu-list button:hover, .menu-list label:hover { background: var(--bg); }
  .menu-note { font-size: 12px; color: var(--muted); padding: 4px 12px 6px; }

  .card {
    background: var(--card); border: 1px solid var(--edge); border-radius: 8px;
    padding: 16px; margin-top: 16px; box-shadow: var(--shadow);
  }
  h2 { font-size: 17px; font-weight: 600; margin: 0 0 4px; }
  .hint { color: var(--muted); font-size: 14px; margin: 0 0 12px; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }

  input[type=text], textarea, select {
    width: 100%; padding: 10px 12px; border: 1px solid var(--edge); border-radius: 6px;
    background: var(--field);
  }
  textarea { min-height: 110px; resize: vertical; }
  input:focus, textarea:focus, select:focus { outline: none; border-color: var(--accent); }

  .alert { border-radius: 6px; padding: 10px 14px; margin-top: 12px; font-size: 14px; }
  .alert.warn { background: var(--amber-bg); color: var(--amber); }
  .alert.ok { background: var(--green-bg); color: var(--green); }

  /* Task list */
  .task {
    border: 1px solid var(--edge); border-left: 3px solid var(--accent); border-radius: 6px;
    padding: 9px 10px; margin-top: 6px; background: var(--card);
  }
  .task { background: var(--n-bg, var(--card)); border-color: var(--n-edge, var(--edge)); border-left: 12px solid var(--n-strong, #d3d3cd); transition: background 0.15s; }
  .task.open { background: var(--n-sel, var(--n-bg, var(--card))); border-color: var(--n-strong, var(--edge)); box-shadow: 0 0 0 1px var(--n-strong, var(--edge)); }
  .tag.type { border-color: var(--n-strong, var(--edge)); font-weight: 500; }
  .tag.type.unset { font-weight: 400; }
  .ed-type { margin-top: 10px; }
  .ty-row { display: flex; align-items: center; gap: 8px; }
  .ty-row i { width: 12px; height: 12px; border-radius: 3px; flex: none; }
  .tag-menu .swatch-row { display: flex; flex-wrap: wrap; gap: 6px; padding: 6px 10px 4px; max-width: 190px; border-top: 1px solid var(--line); margin-top: 2px; }
  .tag-menu .swatch-row button { width: 22px; height: 22px; padding: 0; border-radius: 50%; border: 0; flex: none; }
  .te-row { display: grid; grid-template-columns: 104px 1fr auto; gap: 6px; margin-top: 10px; align-items: center; }
  .te-row .te-words { grid-column: 1 / -1; }
  .bar { height: 6px; border-radius: 3px; background: var(--n-track, var(--line)); margin: 8px 0 0 30px; overflow: hidden; }
  .bar i { display: block; height: 100%; background: var(--n-strong); border-radius: 3px; transition: width 0.25s; }
  .notes { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 8px; align-items: start; margin-top: 6px; }
  .notes .task { margin-top: 0; }
  .note-foot { display: flex; align-items: center; gap: 8px; margin: 6px 0 0 30px; }
  .more { margin-left: auto; background: none; border: none; color: var(--accent); font-size: 12px; cursor: pointer; display: flex; align-items: center; gap: 5px; padding: 4px 0; }
  .more svg { width: 11px; height: 7px; transition: transform 0.15s; }
  .more.open svg { transform: rotate(180deg); }
  .add-step { padding: 6px 8px; font-size: 13px; }
  .sort-row { margin: 8px 0 0; }
  .types-box { margin-top: 16px; padding-top: 10px; border-top: 1px solid var(--line); }
  .types-box:not(.open) #type-chips { display: none; }
  #type-chips { margin-top: 10px; }
  .types-toggle { display: inline-flex; align-items: center; gap: 6px; }
  .types-toggle svg { width: 11px; height: 7px; transition: transform 0.15s; }
  .types-box.open .types-toggle svg { transform: rotate(180deg); }
  .types-toggle.filtering { border-color: var(--accent); color: var(--accent); }
  .seg .tchip i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; background: var(--c); margin-right: 6px; }
  .seg .tchip span { color: var(--muted); margin-left: 2px; }
  .seg .tchip.on { background: var(--card); color: var(--ink); border-color: var(--c); box-shadow: 0 0 0 1px var(--c); }
  .seg .tchip.on span { color: var(--ink); }
  .task-top { display: flex; align-items: center; gap: 10px; }
  .check {
    width: 20px; height: 20px; border-radius: 50%; border: 1.5px solid var(--muted);
    background: none; cursor: pointer; flex: none; padding: 0; position: relative;
  }
  .check::before { content: ''; position: absolute; inset: -12px; }
  .check:hover { border-color: var(--accent); background: var(--hover); }
  .task-main { flex: 1; min-width: 0; }
  .task-title { cursor: pointer; word-break: break-word; }
  .task-main .chips { margin-top: 4px; }
  @media (pointer: coarse) {
    .btn.sm, .list-toggle button { min-height: 38px; }
    .tag { min-height: 30px; padding: 4px 10px; }
    .tags { gap: 8px; }
    .seg button { min-height: 38px; }
    .more { min-height: 32px; }
  }
  .btn.start-btn { flex: none; padding: 6px 16px; font-size: 14px; font-weight: 600; min-height: 36px; border-color: var(--accent); color: var(--accent); }
  .task-steps { margin: 5px 0 0 30px; display: grid; gap: 5px; }
  .step-item { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--muted); }
  .step-item span { word-break: break-word; }
  .step-item.done span { text-decoration: line-through; opacity: 0.6; }
  .step-check {
    width: 16px; height: 16px; border-radius: 3px; border: 1.5px solid var(--muted);
    background: none; padding: 0; cursor: pointer; flex: none; position: relative;
  }
  .step-check.ghost { border-style: dashed; color: var(--muted); font-size: 12px; line-height: 13px; text-align: center; cursor: default; }
  .step-check:hover { border-color: var(--accent); }
  .step-check.on { background: var(--accent); border-color: var(--accent); }
  .step-check.on::after {
    content: ''; position: absolute; left: 4px; top: 0; width: 4px; height: 9px;
    border: solid var(--card); border-width: 0 2px 2px 0; transform: rotate(45deg);
  }
  .step-count { font-size: 12px; white-space: nowrap; opacity: 0.85; }
  .step-arrow {
    background: none; border: none; color: var(--muted); padding: 2px 4px; cursor: pointer;
    margin-left: auto; flex: none; display: flex; align-items: center;
  }
  .step-arrow svg { transition: transform 0.15s; }
  .step-arrow.open svg { transform: rotate(180deg); }
  .step-edit { display: flex; gap: 10px; align-items: center; border-bottom: 1px solid var(--line); }
  .step-edit input { flex: 1; border: none; background: none; padding: 9px 0; border-radius: 0; }
  .step-edit.done input { text-decoration: line-through; opacity: 0.55; }
  .x {
    background: none; border: none; color: var(--muted); font-size: 18px; line-height: 1;
    padding: 4px 6px; cursor: pointer; flex: none;
  }
  .x:hover { color: var(--red); }

  /* Time and energy tags */
  .tags { display: flex; gap: 6px; flex-wrap: wrap; margin: 5px 0 0 30px; }
  .tag {
    font-size: 12px; border: 1px solid var(--edge); border-radius: 4px; padding: 1px 8px;
    background: var(--card); color: var(--ink); cursor: pointer; white-space: nowrap;
  }
  .tag:hover { border-color: var(--accent); }
  .tag.unset { color: var(--muted); border-style: dashed; }
  .tag.on { background: var(--lime); border-color: var(--lime); }
  .tag.static { cursor: default; color: var(--muted); }
  .tag.static:hover { border-color: var(--edge); }
  .tag.old { color: var(--amber); }
  .tag-menu {
    position: fixed; z-index: 80; background: var(--card); border: 1px solid var(--accent);
    border-radius: 6px; padding: 4px; min-width: 130px; box-shadow: var(--pop-shadow);
  }
  .tag-menu button {
    display: block; width: 100%; text-align: left; background: none; border: none;
    padding: 6px 10px; border-radius: 4px; font-size: 14px; cursor: pointer;
  }
  .tag-menu button:hover { background: var(--hover); }
  .tag-menu button.on { color: var(--accent); font-weight: 600; background: var(--hover); }
  .tag-menu button.clear { color: var(--muted); border-top: 1px solid var(--line); border-radius: 0; margin-top: 2px; }
  .chips { display: flex; gap: 4px; flex-wrap: wrap; }
  .chip {
    font-size: 11px; font-weight: 600; border-radius: 6px; padding: 2px 8px;
    background: var(--bg); color: var(--muted); border: 1px solid var(--edge); white-space: nowrap;
  }
  .chip.today { background: var(--lime); color: var(--ink); border-color: var(--lime); }
  .chip.old { background: var(--amber-bg); color: var(--amber); border-color: transparent; }
  .task-edit { margin-top: 10px; display: grid; gap: 8px; }
  .task-edit label { font-size: 12px; color: var(--muted); font-weight: 600; }
  .seg { display: flex; gap: 4px; flex-wrap: wrap; }
  .filters summary { display: grid; grid-template-columns: 1fr auto; align-items: center; cursor: pointer; list-style: none; font-weight: 600; }
  .filters summary::after { grid-row: 1 / span 2; grid-column: 2; }
  .filters summary::-webkit-details-marker { display: none; }
  .filters summary::after { content: '+'; color: var(--muted); font-weight: 400; padding-left: 8px; }
  .filters[open] summary::after { content: '\2212'; }
  .filters summary .hint { margin: 2px 0 0; font-weight: 400; }
  .other-ways { justify-content: center; margin-top: 18px; padding-top: 14px; border-top: 1px solid var(--line); }
  .seg button {
    border: 1px solid var(--edge); background: var(--bg); border-radius: 8px;
    padding: 4px 10px; cursor: pointer; font-size: 13px;
  }
  .seg button.on { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
  .section-label {
    font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.8px;
    color: var(--accent-deep); margin: 16px 0 2px;
  }
  .empty { color: var(--muted); font-size: 14px; padding: 12px 0; }

  /* Swipe */
  .deck { position: relative; height: 300px; margin: 16px auto 0; max-width: 420px; touch-action: none; }
  .swipe-card {
    position: absolute; inset: 0; background: var(--card); border: 1px solid var(--edge);
    border-radius: 6px; box-shadow: var(--shadow); padding: 24px;
    display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center;
    cursor: grab; user-select: none;
  }
  .swipe-card.behind { transform: scale(0.95) translateY(10px); opacity: 0.6; pointer-events: none; }
  .swipe-card { background: var(--n-bg, var(--card)); border-left: 12px solid var(--n-strong, var(--edge)); }
  .swipe-card .t { font-size: 22px; font-weight: 600; }
  .result.picked { background: var(--n-bg, var(--card)); border: 1px solid var(--n-edge, var(--edge)); border-left: 12px solid var(--n-strong, var(--edge)); border-radius: 6px; padding: 12px 14px; margin-left: auto; margin-right: auto; max-width: 420px; }
  .swipe-card .s { font-size: 14px; color: var(--muted); margin-top: 10px; }
  .stamp {
    position: absolute; top: 18px; font-weight: 800; font-size: 20px; letter-spacing: 1px;
    padding: 4px 10px; border-radius: 8px; border: 3px solid; opacity: 0;
  }
  .stamp.yes { left: 18px; color: var(--green); border-color: var(--green); transform: rotate(-12deg); }
  .stamp.no { right: 18px; color: var(--red); border-color: var(--red); transform: rotate(12deg); }
  .swipe-buttons { display: flex; justify-content: center; gap: 10px; margin-top: 16px; flex-wrap: wrap; }

  /* Wheel */
  .wheel-wrap { position: relative; width: min(340px, 100%); margin: 16px auto 0; aspect-ratio: 1; }
  .wheel-wrap canvas { width: 100%; height: 100%; display: block; }
  .pointer {
    position: absolute; top: -6px; left: 50%; transform: translateX(-50%);
    width: 0; height: 0; border-left: 14px solid transparent; border-right: 14px solid transparent;
    border-top: 26px solid var(--ink); z-index: 2;
  }
  .result {
    text-align: center; margin-top: 16px; font-size: 20px; font-weight: 600; min-height: 30px;
  }

  /* Focus */
  .focus-task { text-align: center; font-size: 22px; font-weight: 600; margin-top: 8px; }
  .focus-step {
    text-align: center; margin: 10px auto 0; max-width: 480px; font-size: 15px;
    background: var(--bg); border-radius: 6px; padding: 10px 14px;
  }
  .ring-wrap { position: relative; width: 240px; height: 240px; margin: 20px auto 0; }
  .ring-wrap svg { width: 100%; height: 100%; transform: rotate(-90deg); }
  .ring-time {
    position: absolute; inset: 0; display: flex; flex-direction: column;
    align-items: center; justify-content: center; font-variant-numeric: tabular-nums;
  }
  .ring-time .big { font-size: 46px; font-weight: 700; }
  .ring-time .small { font-size: 13px; color: var(--muted); }
  .presets { display: flex; justify-content: center; gap: 6px; margin-top: 16px; flex-wrap: wrap; }
  .controls { display: flex; justify-content: center; gap: 8px; margin-top: 16px; flex-wrap: wrap; }

  /* Wins */
  .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .stat { background: var(--bg); border-radius: 8px; padding: 12px; text-align: center; }
  .stat .n { font-size: 28px; font-weight: 700; }
  .stat .l { font-size: 12px; color: var(--muted); }
  .win { padding: 8px 0; border-bottom: 1px solid var(--line); font-size: 15px; display: flex; gap: 8px; }
  .win time { color: var(--muted); font-size: 13px; margin-left: auto; white-space: nowrap; }

  /* Modal + toast */
  .overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,0.45); display: none;
    align-items: center; justify-content: center; z-index: 50; padding: 16px;
  }
  .overlay.open { display: flex; }
  .modal {
    background: var(--card); border: 1px solid var(--accent); border-radius: 8px; padding: 18px;
    max-width: 480px; width: 100%; max-height: 88vh; overflow-y: auto; box-shadow: var(--pop-shadow);
  }
  .modal h3 { margin: 0 0 8px; }
  .modal h4 { margin: 18px 0 4px; font-size: 15px; }
  .modal.wide { max-width: 640px; max-height: 88vh; overflow-y: auto; }

  /* How to */
  .help details { border: 1px solid var(--edge); border-radius: 8px; margin-top: 8px; }
  .help summary { cursor: pointer; padding: 12px 14px; font-weight: 600; list-style-position: inside; }
  .help details[open] summary { border-bottom: 1px solid var(--line); }
  .help .body { padding: 4px 14px 12px; font-size: 15px; }
  .help .body p { margin: 10px 0 0; }
  .help .body ul, .help .body ol { margin: 8px 0 0; padding-left: 20px; }
  .help .body li { margin-top: 5px; }
  .help code { background: var(--bg); border-radius: 6px; padding: 1px 5px; font-size: 14px; }

  /* Check-over screen */
  .rv { border-bottom: 1px solid var(--line); padding: 10px 0; }
  .rv-top { display: flex; gap: 6px; align-items: center; }
  .rv-title { flex: 1; font-weight: 600; border: none !important; background: none !important; padding: 4px 0 !important; border-radius: 0 !important; }
  .rv-title:focus { border-bottom: 1px solid var(--accent) !important; }
  .rv .tags { margin-left: 0; }
  .rv-steps { margin-top: 4px; }
  .rv-step { display: flex; align-items: center; gap: 8px; }
  .rv-step input { flex: 1; border: none; background: none; padding: 5px 0; font-size: 14px; border-radius: 0; }
  .rv-step input:focus { border-bottom: 1px solid var(--accent); }
  .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--accent); flex: none; margin: 0 4px; }
  .dot.add { width: auto; height: auto; background: none; color: var(--muted); margin: 0 1px; font-size: 14px; }
  .review-foot {
    position: sticky; bottom: -18px; background: var(--card); padding: 12px 0 2px; margin-top: 8px;
    display: flex; gap: 10px; flex-wrap: wrap; align-items: center;
  }
  .saved { font-size: 12px; color: var(--muted); transition: color 0.2s; }
  .saved.flash { color: var(--accent); }
  .btn.link { border: none; background: none; color: var(--muted); padding: 6px 2px; }
  .btn.link:hover { color: var(--ink); }
  .btn.link.danger { color: var(--red); }
  .btn.on { background: var(--lime); border-color: var(--lime); }

  /* The card */
  .ed-name {
    font-size: 18px; font-weight: 600; border: none !important; border-bottom: 1px solid var(--line) !important;
    border-radius: 0 !important; background: none !important; padding: 8px 0 !important; margin-top: 6px;
  }
  .ed-name:focus { border-bottom-color: var(--accent) !important; }
  .ed-foot { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-top: 14px; }

  /* Adding */
  .capture textarea { min-height: 0; resize: none; }
  .toast {
    position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%) translateY(120px);
    background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 8px;
    transition: transform 0.25s, visibility 0.25s; visibility: hidden; z-index: 60; max-width: calc(100% - 32px); font-size: 14px;
  }
  .toast.show { transform: translateX(-50%) translateY(0); visibility: visible; }
  .toast-undo { margin-left: 10px; background: none; border: none; color: var(--lime); font: inherit; font-weight: 600; cursor: pointer; padding: 4px 2px; }
  #confetti { position: fixed; inset: 0; pointer-events: none; z-index: 70; }

  /* Layout: one column on a phone, loops on the left and Timer + Wins on the right on a computer */
  .layout { max-width: 760px; margin: 0 auto; display: flex; flex-direction: column; }
  .layout > main.wrap { max-width: none; margin: 0; width: 100%; }
  .side { order: -1; padding: 0 16px; }
  .wins-mini { display: none; }
  .wins-mini .stat .n { font-size: 22px; }
  .wins-mini .win { font-size: 14px; }
  .steps-today { font-size: 14px; color: var(--muted); margin: 10px 0 0; text-align: center; }
  .focus-card { scroll-margin-top: var(--head-h, 110px); }
  .focus-card .focus-task { text-align: left; font-size: 17px; font-weight: 500; margin: 0 0 4px; word-break: break-word; }
  .focus-card .focus-step { text-align: left; margin: 0 0 8px; max-width: none; padding: 0; background: none; font-size: 14px; }
  .focus-card .focus-step:empty { display: none; }
  .focus-card .focus-now { text-align: left; margin: 0; max-width: none; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .focus-card .focus-now .label { font-size: 11px; }
  .focus-card .focus-now .text { font-size: 14px; font-weight: 400; margin: 0; flex: 1 1 120px; }
  .focus-card .timer-row { display: flex; align-items: center; gap: 14px; margin-top: 10px; }
  .focus-card .ring-wrap { width: 120px; height: 120px; margin: 0; flex: none; }
  .focus-card .ring-time .big { font-size: 26px; font-weight: 600; }
  .focus-card .ring-time .small { font-size: 11px; }
  .focus-card .timer-side { flex: 1; min-width: 0; }
  .focus-card .presets, .focus-card .controls { justify-content: flex-start; margin-top: 0; gap: 6px; }
  .focus-card .presets + .controls { margin-top: 8px; }
  .focus-card .btn.big { padding: 8px 14px; font-size: 15px; border-radius: 6px; }
  @media (min-width: 980px) {
    header .wrap, .tabbar .wrap, .layout { max-width: 1200px; }
    .layout { display: grid; grid-template-columns: minmax(0, 1fr) 400px; align-items: start; }
    .side {
      order: 0; position: sticky; top: var(--head-h, 110px); padding: 0 16px 24px 0;
      max-height: calc(100vh - var(--head-h, 110px)); overflow-y: auto;
    }
    .wins-mini { display: block; }
    .focus-card .focus-task, .focus-card .focus-step, .focus-card .focus-now { text-align: center; justify-content: center; }
    .focus-card .timer-row { flex-direction: column; gap: 0; margin-top: 8px; }
    .focus-card .ring-wrap { width: 190px; height: 190px; margin-top: 4px; }
    .focus-card .ring-time .big { font-size: 40px; }
    .focus-card .ring-time .small { font-size: 13px; }
    .focus-card .timer-side { width: 100%; }
    .focus-card .presets, .focus-card .controls { justify-content: center; margin-top: 12px; }
  }
  .focus-now .label { font-size: 12px; color: var(--muted); font-weight: 600; text-transform: uppercase; letter-spacing: 0.6px; }
  .focus-now .text { word-break: break-word; }
  .timer-bar {
    position: fixed; left: 50%; bottom: 14px; transform: translateX(-50%); z-index: 35;
    background: var(--accent); color: var(--accent-ink); border: none; border-radius: 6px;
    padding: 10px 18px; font-weight: 600; box-shadow: var(--shadow); cursor: pointer;
    max-width: calc(100% - 32px); white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    display: none; font-variant-numeric: tabular-nums;
  }
  body.has-bar .timer-bar { display: block; }
  body.has-bar .toast { bottom: 74px; }
  body.has-bar .layout { padding-bottom: 80px; }
  .screen { display: none; }
  .screen.active { display: block; }

  @media (max-width: 480px) {
    .stats { grid-template-columns: repeat(3, 1fr); }
    .stat .n { font-size: 22px; }
    .ring-wrap { width: 200px; height: 200px; }
    .ring-time .big { font-size: 38px; }
  }
</style>
</head>
<body>

<header>
  <div class="wrap">
    <div class="head-row">
      <div class="head-l"></div>
      <div class="brand">Open Loops: To-Do List<span class="sub">Brain Dump and Tracker</span></div>
      <div class="head-r">
      <div class="seg list-toggle" id="list-toggle"></div>
      <div class="head-actions">
      <button class="btn sm sync-pill off" id="sync-pill" onclick="openSync()">Sync off</button>
      <button class="btn sm" id="undo-btn" hidden onclick="undoLastAction()">Undo</button>
      <div class="menu">
        <button class="btn sm" onclick="toggleMenu(event)">Data</button>
        <div class="menu-list" id="data-menu">
          <button onclick="exportAllData();closeMenu()">Backup</button>
          <label>Restore
            <input type="file" accept=".json,application/json" style="display:none" onchange="importAllData(event);closeMenu()">
          </label>
          <button id="gh-restore" style="display:none" onclick="openGitRestore();closeMenu()">Restore from GitHub</button>
          <button onclick="openRename();closeMenu()">Rename lists</button>
          <button onclick="openTypesEditor();closeMenu()">Types</button>
          <button onclick="openSync();closeMenu()">Sync settings</button>
          <button onclick="openSettings();closeMenu()">Settings</button>
          <button onclick="openHelp();closeMenu()">How to</button>
          <div class="menu-note" id="backup-note"></div>
        </div>
      </div>
      </div>
      </div>
    </div>
  </div>
</header>
<div class="tabbar">
  <div class="wrap">
    <nav class="tabs" id="tabs">
      <button data-screen="capture" class="active">Loops</button>
      <button data-screen="pick">Pick one</button>
      <button data-screen="wins">Wins</button>
    </nav>
  </div>
</div>

<div class="layout">
<main class="wrap">

  <!-- LOOPS -->
  <section class="screen active" id="screen-capture">
    <div id="backup-alert"></div>
    <div class="card capture">
      <textarea id="quick-add" rows="2" placeholder="What's on your mind?" autocomplete="off"></textarea>
      <div class="row" style="margin-top:8px">
        <button class="btn primary" onclick="addFromBox()">Add</button>
        <button class="btn link" id="ai-btn" onclick="aiExtract()">Add with AI</button>
        <div class="spacer"></div>
        <span id="draft-note"></span>
      </div>
    </div>

    <div class="card">
      <div class="row">
        <h2 style="flex:1">Your loops</h2>
        <span class="hint" style="margin:0" id="loop-count"></span>
      </div>
      <div class="seg sort-row" id="sort-chips"></div>
      <div id="task-list"></div>
      <div class="types-box" id="types-box">
        <button class="btn sm types-toggle" id="types-toggle" onclick="toggleTypes()"></button>
        <div class="seg" id="type-chips"></div>
      </div>
    </div>
  </section>

  <!-- PICK -->
  <section class="screen" id="screen-pick">
    <div class="card">
      <details class="filters" id="filters">
        <summary><span>Right now I have...</span><span class="hint" id="pool-count"></span></summary>
        <label class="hint" style="display:block;margin:12px 0 4px">Energy</label>
        <div class="seg" id="f-energy"></div>
        <label class="hint" style="display:block;margin:10px 0 4px">Time</label>
        <div class="seg" id="f-time"></div>
        <label style="display:flex;gap:6px;align-items:center;margin-top:10px;font-size:14px">
          <input type="checkbox" id="f-today"> Only today's picks
        </label>
      </details>
    </div>

    <div class="card">
      <div id="mode-random">
        <div class="result" id="random-result" style="margin-top:12px"></div>
        <div class="controls">
          <button class="btn primary big" onclick="randomPick()">Pick for me</button>
          <button class="btn big" id="random-go" style="display:none" onclick="startFromPick()">Start this</button>
        </div>

      <div id="mode-swipe" style="display:none">
        <div class="deck" id="deck"></div>

      <div id="mode-wheel" style="display:none">

      <div class="seg other-ways" id="pick-mode">

  <!-- WINS -->
  <section class="screen" id="screen-wins">
    <div class="card">
      <h2>Closed loops</h2>
      <div class="stats">
        <div class="stat"><div class="n" id="s-today">0</div><div class="l">today</div></div>
        <div class="stat"><div class="n" id="s-week">0</div><div class="l">last 7 days</div></div>
        <div class="stat"><div class="n" id="s-streak">0</div><div class="l">day streak</div></div>
      </div>
      <div id="wins-list" style="margin-top:12px"></div>
    </div>

</main>

<!-- WINS: a column on the right on a computer -->
<aside class="side" id="side">
  <div class="card focus-card" id="focus-card">
    <div id="focus-empty"><select id="focus-select"></select></div>
    <div id="focus-on" style="display:none">
      <div class="focus-task" id="focus-title"></div>
      <div class="focus-step" id="focus-step"></div>
    </div>
    <div class="timer-row">
      <div class="ring-wrap">
        <svg viewBox="0 0 100 100">
          <circle cx="50" cy="50" r="44" fill="none" stroke="var(--line)" stroke-width="8"/>
          <circle id="ring" cx="50" cy="50" r="44" fill="none" stroke="var(--accent)" stroke-width="8"
                  stroke-linecap="round" stroke-dasharray="276.46" stroke-dashoffset="0"/>
        </svg>
        <div class="ring-time">
          <div class="big" id="clock">25:00</div>
          <div class="small" id="clock-sub">ready</div>
        </div>
      </div>
      <div class="timer-side">
        <div class="presets" id="presets"></div>

<button class="timer-bar" id="timer-bar" onclick="scrollToFocus()"></button>

<!-- Modal -->
<div class="overlay" id="overlay">
  <div class="modal" id="modal"></div>
</div>
<div class="toast" id="toast"></div>
<canvas id="confetti"></canvas>

<script>
// ═══════════════════════════════════════════════════════
//  STORAGE
//  Everything lives in this browser's localStorage. There are
//  two lists (Work and Home). With sync turned on, each list is
//  also saved as a file in your private GitHub repo, so any
//  device can see it. Backup / Restore still works as a file.
// ═══════════════════════════════════════════════════════

const STORE_KEY = 'openloops_v2';
const OLD_STORE_KEY = 'openloops_v1';
const APP_ID = 'open-loops';
const LIST_NAMES = ['Work', 'Home'];
const COLORS = ['green', 'blue', 'purple', 'teal', 'pink', 'red', 'orange', 'yellow', 'gray'];
const TYPE_MAX = 12;
const TYPE_NAME_MAX = 24;
const TODAY_LIMIT = 3;
const OLD_DAYS = 14;
const BACKUP_NUDGE_DAYS = 7;
const TOMBSTONE_DAYS = 90;

const ENCOURAGEMENT = [
  'Loop closed. Your brain just got a little quieter.',
  'Done. That one is off your plate for good.',
  'Nice. Momentum is real, want another?',
  'Closed. Future you says thanks.',
  'That counts. Every single one counts.',
  'One less thing to carry around.'
];

function emptyList() { return { tasks: [], deleted: {} }; }

function defaultState() {
  const lists = {};
  LIST_NAMES.forEach(n => lists[n] = emptyList());
  return {
    app: APP_ID,
    version: 2,
    current: 'Work',
    lists,
    settings: { sound: true, lastBackup: null, lastAutoBackup: null },
    timer: null
  };
}

// Task ids end up inside onclick attributes, so anything that came
// from a file or from GitHub gets checked before it is used.
function cleanTask(t) {
  if (!t || typeof t !== 'object' || typeof t.title !== 'string') return null;
  if (typeof t.id !== 'string' || !/^[a-z0-9]{1,40}$/.test(t.id)) t.id = uid();
  if (!t.created || isNaN(new Date(t.created))) t.created = new Date().toISOString();
  if (t.color !== undefined && !COLORS.includes(t.color)) delete t.color;
  if (t.type !== undefined && !(typeof t.type === 'string' && /^[a-z0-9]{1,20}$/.test(t.type))) delete t.type;
  if (t.steps !== undefined) {
    const okStep = x => x && typeof x.text === 'string' && typeof x.id === 'string' && /^[a-z0-9]{1,40}$/.test(x.id);
    if (!Array.isArray(t.steps)) delete t.steps;
    else if (!t.steps.every(okStep)) {
      t.steps = t.steps.filter(x => x && typeof x.text === 'string')
        .map(x => ({ id: typeof x.id === 'string' && /^[a-z0-9]{1,40}$/.test(x.id) ? x.id : uid(), text: x.text, done: !!x.done }));
    }
  }
  return t;
}

function cleanList(l) {
  l = l && typeof l === 'object' ? l : {};
  const out = {
    tasks: (Array.isArray(l.tasks) ? l.tasks : []).map(cleanTask).filter(Boolean),
    deleted: l.deleted && typeof l.deleted === 'object' ? l.deleted : {}
  };
  // Optional display name for the list (the key stays Work or Home); older copies of the app never set it
  const label = typeof l.label === 'string' ? l.label.replace(/[\u0000-\u001f]/g, '').trim().slice(0, LABEL_MAX) : '';
  if (label) { out.label = label; out.labelAt = Number(l.labelAt) > 0 ? Number(l.labelAt) : 0; }
  // Optional list of types (kinds of work); older copies of the app never set it
  const types = cleanTypes(l.types);
  if (types && Number(l.typesAt) > 0) { out.types = types; out.typesAt = Number(l.typesAt); }
  return out;
}

function cleanTypes(arr) {
  if (!Array.isArray(arr)) return null;
  const seen = new Set();
  const clean = s => String(s).replace(/[\u0000-\u001f]/g, '').replace(/\s+/g, ' ').trim();
  return arr.slice(0, TYPE_MAX).map(x => {
    if (!x || typeof x !== 'object') return null;
    const id = typeof x.id === 'string' && /^[a-z0-9]{1,20}$/.test(x.id) && x.id !== 'none' ? x.id : null;
    const name = typeof x.name === 'string' ? clean(x.name).slice(0, TYPE_NAME_MAX) : '';
    if (!id || !name || seen.has(id)) return null;
    seen.add(id);
    const words = (Array.isArray(x.words) ? x.words : []).filter(w => typeof w === 'string')
      .map(w => clean(w).toLowerCase().slice(0, 30)).filter(Boolean).slice(0, 40);
    return { id, name, color: COLORS.includes(x.color) ? x.color : 'gray', words };
  }).filter(Boolean);
}

const LABEL_MAX = 20;
function listLabel(n) { return (state.lists[n] && state.lists[n].label) || n; }

function loadState() {
  const base = defaultState();
  try {
    const raw = localStorage.getItem(STORE_KEY);
    if (raw) {
      const s = JSON.parse(raw);
      const lists = {};
      LIST_NAMES.forEach(n => lists[n] = cleanList(s.lists && s.lists[n]));
      return Object.assign(base, s, {
        lists,
        current: LIST_NAMES.includes(s.current) ? s.current : 'Work',
        settings: Object.assign(base.settings, s.settings || {})
      });
    }
    // One-time move from the first version, which had one list per browser
    const old = localStorage.getItem(OLD_STORE_KEY);
    if (old) {
      const o = JSON.parse(old);
      const name = LIST_NAMES.includes(o.space) ? o.space : 'Work';
      base.lists[name] = cleanList({ tasks: o.tasks });
      base.current = name;
      base.settings = Object.assign(base.settings, o.settings || {});
      base.timer = o.timer || null;
    }
  } catch {}
  return base;
}

let state = loadState();

// The list on screen right now
function L() { return state.lists[state.current]; }

// ── Change tracking ─────────────────────────────────
// Every save compares each list to how it looked at the last save.
// Anything new or changed gets a fresh "updated" time, anything
// removed gets a deletion record. Sync uses those to merge two
// devices without losing edits from either one.

const _baseline = {};
const sigOf = t => JSON.stringify(Object.assign({}, t, { updated: undefined }));

function setBaseline(name) {
  const m = {};
  state.lists[name].tasks.forEach(t => m[t.id] = sigOf(t));
  _baseline[name] = m;
}

function stampChanges(name) {
  const list = state.lists[name];
  const base = _baseline[name] || {};
  const now = Date.now();
  const seen = {};
  let changed = false;
  list.tasks.forEach(t => {
    const sig = sigOf(t);
    if (base[t.id] !== sig) { t.updated = now; changed = true; }
    seen[t.id] = sig;
    if (list.deleted[t.id]) delete list.deleted[t.id];
  });
  Object.keys(base).forEach(id => { if (!seen[id]) { list.deleted[id] = now; changed = true; } });
  _baseline[name] = seen;
  return changed;
}

function writeLocal() {
  try { localStorage.setItem(STORE_KEY, JSON.stringify(state)); }
  catch (e) { toast('Could not save. Your browser storage may be full or blocked. Make a Backup now.'); }
}

function save() {
  // Record what the last undoable action changed (see UNDO)
  const top = _undoStack[_undoStack.length - 1];
  if (top && top.after == null) top.after = JSON.stringify(state.lists[top.list].tasks);
  LIST_NAMES.forEach(name => { if (stampChanges(name)) markDirty(name); });
  writeLocal();
}

LIST_NAMES.forEach(name => {
  // Older data has no "updated" times yet; give them one so merges have something to compare
  state.lists[name].tasks.forEach(t => { if (!t.updated) t.updated = new Date(t.created || Date.now()).getTime(); });
  setBaseline(name);
});

// ═══════════════════════════════════════════════════════
//  UNDO
//  Short in-memory history, same idea as the coverage
//  tracker: catches an "oops" within a session. A page
//  refresh clears it. Restore clears it too.
// ═══════════════════════════════════════════════════════

const UNDO_LIMIT = 15;
let _undoStack = [];

function pushUndoSnapshot(label) {
  _undoStack.push({ at: Date.now(), label, list: state.current, tasks: JSON.stringify(L().tasks) });
  if (_undoStack.length > UNDO_LIMIT) _undoStack.shift();
  updateUndoButton();
}

function clearUndoHistory() {
  _undoStack = [];
  updateUndoButton();
}

function updateUndoButton() {
  const btn = document.getElementById('undo-btn');
  const top = _undoStack[_undoStack.length - 1];
  btn.hidden = !top;
  btn.title = top ? 'Undo: ' + top.label : '';
}

function undoLastAction() {
  const snap = _undoStack.pop();
  if (!snap) return;
  // Only put back the loops this one action changed, so undo never
  // wipes out edits that synced in from another device since then
  const before = new Map(JSON.parse(snap.tasks).map(t => [t.id, t]));
  const after = new Map(JSON.parse(snap.after || snap.tasks).map(t => [t.id, t]));
  const list = state.lists[snap.list];
  new Set([...before.keys(), ...after.keys()]).forEach(id => {
    if (JSON.stringify(before.get(id)) === JSON.stringify(after.get(id))) return;
    const i = list.tasks.findIndex(t => t.id === id);
    if (before.has(id)) {
      if (i >= 0) list.tasks[i] = before.get(id); else list.tasks.push(before.get(id));
    } else if (i >= 0) list.tasks.splice(i, 1);
  });
  list.tasks.sort(byNewest);
  if (snap.list !== state.current) state.current = snap.list;
  save();
  renderAll();
  updateUndoButton();
  toast('Undone: ' + snap.label, true);
}

// ═══════════════════════════════════════════════════════
//  BACKUP / RESTORE
//  Same idea as the coverage tracker: Backup downloads one file
//  with both lists. Restore checks the file, shows its date, and
//  asks before replacing anything. The sync token is never put
//  in a backup file.
// ═══════════════════════════════════════════════════════

function todayStr(d = new Date()) {
  const p = n => String(n).padStart(2, '0');
  return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())}`;
}

// Same shape for the downloaded file and the GitHub copy. Never holds a token.
function backupPayload(at) {
  const lists = {};
  LIST_NAMES.forEach(n => lists[n] = state.lists[n]);
  return {
    app: APP_ID,
    exportedAt: at,
    exportedFrom: window.location.href,
    version: 2,
    lists,
    settings: { sound: state.settings.sound }
  };
}

function exportAllData() {
  state.settings.lastBackup = new Date().toISOString();
  save();
  const payload = backupPayload(state.settings.lastBackup);
  const blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `open loops backup ${todayStr()}.json`;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
  renderBackupNote();
  toast('Backup downloaded. Check your Downloads folder.');
}

function importAllData(event) {
  const file = event.target.files[0];
  if (!file) return;
  event.target.value = '';
  const reader = new FileReader();
  reader.onload = function (e) {
    try {
      restorePayload(JSON.parse(e.target.result));
    } catch (err) {
      alert('Could not restore data: ' + err.message);
    }
  };
  reader.readAsText(file);
}

// Checks a backup, shows its date and contents, and asks before replacing anything
function restorePayload(payload) {
    try {
      if (!payload || payload.app !== APP_ID || !(payload.lists || Array.isArray(payload.tasks))) {
        alert('This does not appear to be an Open Loops backup file.');
        return;
      }
      const when = payload.exportedAt ? payload.exportedAt.slice(0, 10) : 'unknown date';

      // Backups from the first version hold a single list
      let incoming = {};
      if (payload.lists) {
        LIST_NAMES.forEach(n => { if (payload.lists[n]) incoming[n] = cleanList(payload.lists[n]); });
      } else {
        incoming[LIST_NAMES.includes(payload.space) ? payload.space : 'Work'] = cleanList({ tasks: payload.tasks });
      }
      const names = Object.keys(incoming);
      if (!names.length) { alert('This backup has no lists in it.'); return; }
      const summary = names.map(n => `${n}: ${incoming[n].tasks.length} items`).join('\n');
      let msg = `This will replace your current ${names.join(' and ')} list${names.length > 1 ? 's' : ''} with the backup from ${when}.\n\n${summary}`;
      if (syncOn()) msg += '\n\nSync is on, so this will also replace the list on your other devices.';
      if (!confirm(msg + '\n\nContinue?')) return;

      names.forEach(n => {
        // Keep the old deletion records so the replaced items stay gone everywhere
        incoming[n].deleted = Object.assign({}, state.lists[n].deleted, incoming[n].deleted);
        state.lists[n] = incoming[n];
        // Force every restored item to count as a fresh edit so it wins any sync merge
        _baseline[n] = Object.fromEntries(Object.entries(_baseline[n] || {}).map(([id]) => [id, '']));
      });
      if (payload.settings && typeof payload.settings.sound === 'boolean') state.settings.sound = payload.settings.sound;
      save();
      clearUndoHistory(); // pre-restore snapshots don't belong to the restored data
      renderAll();
      alert('Restore complete!');
    } catch (err) {
      alert('Could not restore data: ' + err.message);
    }
}

// ═══════════════════════════════════════════════════════
//  SYNC (GitHub)
//  Each list is one file (work.json, home.json) in a private
//  repo. Every sync reads the file, merges it with this device
//  item by item, and writes it back only if something changed.
//  The token stays in this browser only. It is never put in a
//  backup file and never sent anywhere except api.github.com.
// ═══════════════════════════════════════════════════════

const SYNC_KEY = 'openloops_sync';
const POLL_MS = 60000;

function loadSync() {
  try { return JSON.parse(localStorage.getItem(SYNC_KEY)) || null; } catch { return null; }
}

let sync = loadSync();
let syncStatus = { kind: 'off', msg: '', at: null };
const _dirty = new Set();
let _pushTimer = null;
let _syncing = false;
let _syncAgain = false;

function syncOn() { return !!(sync && sync.token && sync.owner && sync.repo); }

function markDirty(name) {
  if (!syncOn()) return;
  _dirty.add(name);
  if (!['error', 'offline'].includes(syncStatus.kind)) setSyncStatus('pending');
  clearTimeout(_pushTimer);
  _pushTimer = setTimeout(() => runSync(), 1500);
}

let _lastErrorToast = '';
function setSyncStatus(kind, msg) {
  syncStatus = { kind, msg: msg || '', at: kind === 'ok' ? new Date() : syncStatus.at };
  if (kind === 'error' && msg !== _lastErrorToast) toast(msg);
  _lastErrorToast = kind === 'error' ? msg : (kind === 'ok' || kind === 'off' ? '' : _lastErrorToast);
  renderSyncPill();
}

function renderSyncPill() {
  const el = document.getElementById('sync-pill');
  if (!el) return;
  const k = syncOn() ? syncStatus.kind : 'off';
  const text = {
    off: 'Sync off',
    pending: 'Saving...',
    busy: 'Syncing...',
    ok: 'Synced',
    offline: 'Offline',
    error: 'Sync problem'
  }[k] || 'Sync';
  el.textContent = text;
  el.className = 'btn sm sync-pill ' + k;
  el.title = k === 'ok' && syncStatus.at
    ? 'Last synced ' + syncStatus.at.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' })
    : k === 'offline' ? 'Cannot reach GitHub. Changes are saved on this device and will sync when it can.'
    : syncStatus.msg || 'Sync settings';
}

const filePath = name => `${name.toLowerCase()}.json`;

function gh(path, opts = {}) {
  const headers = { 'Accept': 'application/vnd.github+json', 'Authorization': `Bearer ${sync.token}` };
  if (opts.body) headers['Content-Type'] = 'application/json';
  return fetch(`https://api.github.com/repos/${encodeURIComponent(sync.owner)}/${encodeURIComponent(sync.repo)}${path}`,
    Object.assign({ cache: 'no-store' }, opts, { headers }));
}

class SyncError extends Error {
  constructor(kind, msg) { super(msg); this.kind = kind; }
}

function httpError(res) {
  if (res.status === 401) return new SyncError('error', 'Your GitHub token stopped working (it may have expired). Open Sync settings and paste a new one.');
  if (res.status === 404) return new SyncError('error', `Can't find the repo "${sync.owner}/${sync.repo}", or the token isn't allowed to see it.`);
  if (res.status === 403 || res.status === 429) return new SyncError('error', 'GitHub refused the save. Check that the token has Contents set to "Read and write".');
  return new SyncError('error', `GitHub said ${res.status}. Your changes are safe on this device.`);
}

function toB64(str) {
  const bytes = new TextEncoder().encode(str);
  let bin = '';
  for (let i = 0; i < bytes.length; i += 0x8000) bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
  return btoa(bin);
}

function fromB64(b64) {
  const bin = atob(b64.replace(/\s/g, ''));
  return new TextDecoder().decode(Uint8Array.from(bin, c => c.charCodeAt(0)));
}

async function fetchRemote(name) {
  const res = await gh(`/contents/${filePath(name)}?t=${Date.now()}`);
  if (res.status === 404) {
    // Could be "file not made yet" (fine) or "repo not visible" (not fine)
    const repo = await gh('');
    if (!repo.ok) throw httpError(repo);
    return { sha: null, data: null };
  }
  if (!res.ok) throw httpError(res);
  const j = await res.json();
  return { sha: j.sha, data: JSON.parse(fromB64(j.content || '')) };
}

const byNewest = (a, b) => String(b.created || '').localeCompare(String(a.created || ''));

function mergeLists(local, remote) {
  const deleted = Object.assign({}, remote.deleted);
  Object.entries(local.deleted).forEach(([id, ts]) => { if (!deleted[id] || ts > deleted[id]) deleted[id] = ts; });
  const byId = new Map();
  // Local goes second so it wins a tie
  [...remote.tasks, ...local.tasks].forEach(t => {
    const cur = byId.get(t.id);
    if (!cur || (t.updated || 0) >= (cur.updated || 0)) byId.set(t.id, t);
  });
  const cutoff = Date.now() - TOMBSTONE_DAYS * 86400000;
  Object.keys(deleted).forEach(id => { if (deleted[id] < cutoff) delete deleted[id]; });
  const tasks = [...byId.values()].filter(t => !(deleted[t.id] && deleted[t.id] >= (t.updated || 0)));
  tasks.sort(byNewest);
  const merged = { tasks, deleted };
  // The newer list name wins
  const src = (remote.labelAt || 0) > (local.labelAt || 0) ? remote : local;
  if (src.label) { merged.label = src.label; merged.labelAt = src.labelAt || 0; }
  // Same for the types: the newer edit wins
  const tsrc = (remote.typesAt || 0) > (local.typesAt || 0) ? remote : local;
  if (tsrc.types) { merged.types = tsrc.types; merged.typesAt = tsrc.typesAt || 0; }
  return merged;
}

function canon(list) {
  return JSON.stringify([
    list.tasks.map(t => JSON.stringify(t)).sort(),
    Object.keys(list.deleted).sort().map(k => k + ':' + list.deleted[k]),
    list.label || '', list.labelAt || 0,
    JSON.stringify(list.types || null), list.typesAt || 0
  ]);
}

async function syncList(name, attempt = 0) {
  const remote = await fetchRemote(name);
  save(); // stamp anything edited while the request was out
  const before = canon(state.lists[name]);
  const remoteList = remote.data ? cleanList(remote.data) : emptyList();
  const merged = mergeLists(state.lists[name], remoteList);
  state.lists[name] = merged;
  setBaseline(name);
  writeLocal();
  if (name === state.current && canon(merged) !== before) refreshAfterSync();
  else if (canon(merged) !== before) renderListToggle();

  if (remote.data && canon(remoteList) === canon(merged)) return;
  const body = JSON.stringify({ app: APP_ID, list: name, savedAt: new Date().toISOString(), tasks: merged.tasks, deleted: merged.deleted, label: merged.label, labelAt: merged.labelAt, types: merged.types, typesAt: merged.typesAt }, null, 1);
  const put = { message: `Update ${name} list`, content: toB64(body) };
  if (remote.sha) put.sha = remote.sha;
  const res = await gh(`/contents/${filePath(name)}`, { method: 'PUT', body: JSON.stringify(put) });
  // 409/422 means another device saved in between; read again and re-merge
  if ((res.status === 409 || res.status === 422) && attempt < 3) return syncList(name, attempt + 1);
  if (!res.ok) throw httpError(res);
}

async function runSync(names) {
  if (!syncOn()) return;
  if (_syncing) { names && names.forEach(n => _dirty.add(n)); _syncAgain = true; return; }
  clearTimeout(_pushTimer);
  _syncing = true;
  setSyncStatus('busy');
  const todo = [...new Set([...(names || []), ..._dirty])];
  _dirty.clear();
  try {
    for (const name of todo) await syncList(name);
    setSyncStatus('ok');
    // Both lists are fresh only after a full sync (when the app opens), so back up then
    if (LIST_NAMES.every(n => todo.includes(n))) autoBackup();
  } catch (e) {
    todo.forEach(n => _dirty.add(n));
    if (e instanceof SyncError) setSyncStatus(e.kind, e.message);
    else setSyncStatus('offline', 'Cannot reach GitHub.');
  }
  _syncing = false;
  if (_syncAgain || (_dirty.size && syncStatus.kind === 'ok')) { _syncAgain = false; runSync(); }
}

// Re-draw with what came in from another device, unless you're typing in an editor right now
function refreshAfterSync() {
  const a = document.activeElement;
  if (a && (a.closest('#task-list') || a.closest('#modal') || a.closest('#side')) && ['INPUT', 'TEXTAREA'].includes(a.tagName)) return;
  renderAll();
}

function guessOwner() {
  const h = location.hostname;
  return h.endsWith('.github.io') ? h.split('.')[0] : '';
}

function openSync() {
  const s = sync || {};
  openModal(`<h3>Sync with GitHub</h3>
    <p class="hint">Keeps your devices on the same lists. Setup steps are in Data, How to.</p>
    <label class="hint" style="display:block;margin:8px 0 4px">GitHub username</label>
    <input type="text" id="sy-owner" value="${esc(s.owner || guessOwner())}" autocomplete="off" autocapitalize="off">
    <label class="hint" style="display:block;margin:10px 0 4px">Private repo name</label>
    <input type="text" id="sy-repo" value="${esc(s.repo || 'open-loops-data')}" autocomplete="off" autocapitalize="off">
    <label class="hint" style="display:block;margin:10px 0 4px">Access token</label>
    <input type="password" id="sy-token" value="${esc(s.token || '')}" placeholder="github_pat_..." autocomplete="off">
    <p class="hint" style="font-size:12px;margin-top:6px">The token is saved only in this browser. It is never put in a backup file.</p>
    <div id="sy-msg"></div>
    <div class="row" style="margin-top:14px;justify-content:flex-end">
      ${syncOn() ? '<button class="btn danger" onclick="disconnectSync()">Turn off sync</button><div class="spacer"></div>' : ''}
      <button class="btn" onclick="closeModal()">Cancel</button>
      <button class="btn primary" id="sy-go" onclick="connectSync()">${syncOn() ? 'Save' : 'Connect'}</button>
    </div>`);
}

async function connectSync() {
  const owner = document.getElementById('sy-owner').value.trim();
  const repo = document.getElementById('sy-repo').value.trim();
  const token = document.getElementById('sy-token').value.trim();
  const msg = document.getElementById('sy-msg');
  const show = (cls, text) => msg.innerHTML = `<div class="alert ${cls}">${esc(text)}</div>`;
  if (!owner || !repo || !token) { show('warn', 'Fill in all three boxes.'); return; }
  const btn = document.getElementById('sy-go');
  btn.disabled = true; btn.textContent = 'Checking...';
  const prev = sync;
  sync = { owner, repo, token };
  try {
    const res = await gh('');
    if (!res.ok) throw httpError(res);
    const info = await res.json();
    if (!info.private) {
      sync = prev;
      show('warn', `"${repo}" is public, so anyone could read your tasks. Make it private on GitHub (repo Settings, bottom of the page, Change visibility), then try again.`);
      btn.disabled = false; btn.textContent = 'Connect';
      return;
    }
  } catch (e) {
    sync = prev;
    show('warn', e instanceof SyncError ? e.message : 'Could not reach GitHub. Check your internet connection.');
    btn.disabled = false; btn.textContent = 'Connect';
    return;
  }
  try { localStorage.setItem(SYNC_KEY, JSON.stringify(sync)); } catch {}
  closeModal();
  toast('Connected. Merging this device with GitHub...');
  await runSync(LIST_NAMES);
  if (syncStatus.kind === 'ok') toast('Synced. Both lists are now saved to GitHub.');
}

function disconnectSync() {
  if (!confirm('Turn off sync on this device? Your loops stay here, they just stop syncing.')) return;
  sync = null;
  try { localStorage.removeItem(SYNC_KEY); } catch {}
  setSyncStatus('off');
  closeModal();
}

// ── Automatic backups to GitHub ─────────────────────
// With sync on, about once a week the app saves a dated copy of both
// lists to backups/ in the same private repo, and keeps the newest 12.
// Any device can do it; each one checks the folder first so two
// devices don't both save one the same week.

const AUTO_BACKUP_DAYS = 7;
const AUTO_BACKUP_KEEP = 12;
const BACKUP_DIR = 'backups';
const BACKUP_NAME_RE = /^open loops backup (\d{4}-\d{2}-\d{2})\.json$/;
let _autoBackupRunning = false;

const backupUrl = name => `/contents/${BACKUP_DIR}/${encodeURIComponent(name)}`;

// Newest first. Only files this app named, so nothing else in the folder is ever touched.
async function listGitBackups() {
  const res = await gh(`/contents/${BACKUP_DIR}?t=${Date.now()}`);
  if (res.status === 404) return [];
  if (!res.ok) throw httpError(res);
  const items = await res.json();
  return (Array.isArray(items) ? items : [])
    .filter(f => f.type === 'file' && BACKUP_NAME_RE.test(f.name))
    .map(f => ({ name: f.name, sha: f.sha, date: f.name.match(BACKUP_NAME_RE)[1] }))
    .sort((a, b) => b.date.localeCompare(a.date));
}

async function autoBackup() {
  if (!syncOn() || _autoBackupRunning) return;
  // This device already knows a recent one exists, so skip the network
  if (daysSince(state.settings.lastAutoBackup) < AUTO_BACKUP_DAYS) return;
  _autoBackupRunning = true;
  try {
    const existing = await listGitBackups();
    const newest = existing[0];
    if (newest && daysSince(newest.date + 'T12:00:00') < AUTO_BACKUP_DAYS) {
      state.settings.lastAutoBackup = newest.date + 'T12:00:00';
    } else {
      const now = new Date();
      const name = `open loops backup ${todayStr(now)}.json`;
      const body = JSON.stringify(backupPayload(now.toISOString()), null, 1);
      const res = await gh(backupUrl(name), { method: 'PUT', body: JSON.stringify({ message: `Weekly backup ${todayStr(now)}`, content: toB64(body) }) });
      // 422 means another device saved today's already, which is just as good
      if (!res.ok && res.status !== 422) throw httpError(res);
      state.settings.lastAutoBackup = now.toISOString();
      const all = [{ name, date: todayStr(now) }, ...existing.filter(f => f.name !== name)];
      for (const old of all.slice(AUTO_BACKUP_KEEP)) {
        if (!old.sha) continue;
        await gh(backupUrl(old.name), { method: 'DELETE', body: JSON.stringify({ message: `Remove old backup ${old.date}`, sha: old.sha }) });
      }
    }
    writeLocal();
    renderBackupNote();
  } catch {
    // Quiet on purpose. If this keeps failing, the backup banner comes back after 30 days.
  }
  _autoBackupRunning = false;
}

async function openGitRestore() {
  if (!syncOn()) { openSync(); return; }
  openModal('<h3>Restore from GitHub</h3><p class="hint">Looking for backups...</p>');
  let list;
  try { list = await listGitBackups(); }
  catch (e) {
    openModal(`<h3>Restore from GitHub</h3><div class="alert warn">${esc(e instanceof SyncError ? e.message : 'Could not reach GitHub. Check your internet connection.')}</div>
      <div class="row" style="margin-top:14px;justify-content:flex-end"><button class="btn" onclick="closeModal()">Close</button></div>`);
    return;
  }
  const label = d => new Date(d + 'T12:00:00').toLocaleDateString([], { weekday: 'short', month: 'short', day: 'numeric', year: 'numeric' });
  openModal(`<h3>Restore from GitHub</h3>
    <p class="hint">Weekly backups, newest first.</p>
    ${list.length
      ? list.map(f => `<button class="btn" style="display:block;width:100%;text-align:left;margin-top:6px" onclick="restoreGitBackup('${f.date}')">${esc(label(f.date))}</button>`).join('')
      : '<div class="empty">No backups yet. The first one is saved the next time the app opens with sync on.</div>'}
    <div class="row" style="margin-top:14px;justify-content:flex-end"><button class="btn" onclick="closeModal()">Cancel</button></div>`);
}

async function restoreGitBackup(date) {
  if (!/^\d{4}-\d{2}-\d{2}$/.test(date)) return;
  try {
    const res = await gh(`${backupUrl(`open loops backup ${date}.json`)}?t=${Date.now()}`);
    if (!res.ok) throw httpError(res);
    const j = await res.json();
    const payload = JSON.parse(fromB64(j.content || ''));
    closeModal();
    restorePayload(payload);
  } catch (e) {
    toast(e instanceof SyncError ? e.message : 'Could not load that backup. Try again in a minute.');
  }
}

// Pull in changes from other devices when you come back to the tab, and once a minute while it's open
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') runSync([state.current]); });
setInterval(() => { if (document.visibilityState === 'visible') runSync([state.current]); }, POLL_MS);
window.addEventListener('online', () => runSync([state.current]));

function daysSince(iso) {
  if (!iso) return Infinity;
  return Math.floor((Date.now() - new Date(iso).getTime()) / 86400000);
}

function renderBackupNote() {
  const ago = n => n === 0 ? 'today' : `${n} day${n === 1 ? '' : 's'} ago`;
  const dl = daysSince(state.settings.lastBackup);
  const auto = daysSince(state.settings.lastAutoBackup);
  const d = Math.min(dl, auto);
  const parts = [];
  if (auto !== Infinity) parts.push(`Last GitHub backup: ${ago(auto)}`);
  if (dl !== Infinity) parts.push(`Last download: ${ago(dl)}`);
  document.getElementById('backup-note').textContent = parts.length ? parts.join('. ') : 'Never backed up';
  document.getElementById('gh-restore').style.display = syncOn() ? '' : 'none';
  const box = document.getElementById('backup-alert');
  const active = LIST_NAMES.reduce((n, k) => n + state.lists[k].tasks.filter(t => !t.done).length, 0);
  // With sync on, GitHub keeps every version, so the reminder can wait longer
  if (active >= 5 && d >= (syncOn() ? 30 : BACKUP_NUDGE_DAYS)) {
    box.innerHTML = `<div class="alert warn">${d === Infinity ? 'You have never made a backup.' : `Your last backup was ${d} days ago.`}
      If this browser's data gets cleared, your loops go with it.
      <button class="btn sm" style="margin-left:6px" onclick="exportAllData()">Back up now</button></div>`;
  } else {
    box.innerHTML = '';
  }
}

// ═══════════════════════════════════════════════════════
//  TASKS
// ═══════════════════════════════════════════════════════

const ENERGY = { low: 'Low energy', med: 'Some energy', high: 'High energy' };
const SIZES = [2, 15, 30, 60];
const sizeLabel = m => m === 2 ? '2 min' : m === 60 ? '1 hr+' : m + ' min';

function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }

let _lastCreated = 0;

function addTask(title) {
  title = title.trim();
  if (!title) return null;
  // Each new loop gets a slightly later time than the last, so a brain dump keeps its order
  _lastCreated = Math.max(Date.now(), _lastCreated + 1);
  const t = { id: uid(), title, step: '', energy: null, size: null, today: false, created: new Date(_lastCreated).toISOString(), snoozeUntil: null, done: null, skips: 0 };
  L().tasks.unshift(t);
  return t;
}

// Looks in both lists, so a running timer still finds its loop after you switch lists
function findTask(id) {
  for (const n of LIST_NAMES) { const t = state.lists[n].tasks.find(x => x.id === id); if (t) return t; }
  return null;
}

function isSnoozed(t) { return t.snoozeUntil && t.snoozeUntil > todayStr(); }

function activeTasks() { return L().tasks.filter(t => !t.done && !isSnoozed(t)); }

function completeTask(id) {
  const t = findTask(id);
  if (!t || t.done) return;
  pushUndoSnapshot('complete "' + t.title + '"');
  t.done = new Date().toISOString();
  t.today = false;
  save();
  celebrate();
  renderAll();
}

function letGo(id) {
  const t = findTask(id);
  if (!t) return;
  pushUndoSnapshot('let go of "' + t.title + '"');
  L().tasks = L().tasks.filter(x => x.id !== id);
  save();
  renderAll();
  toast('Let go. Deciding not to do something also closes the loop.');
}

function snooze(id) {
  const t = findTask(id);
  if (!t) return;
  pushUndoSnapshot('snooze "' + t.title + '"');
  const d = new Date(); d.setDate(d.getDate() + 1);
  t.snoozeUntil = todayStr(d);
  t.today = false;
  save();
  renderAll();
  toast('Hidden until tomorrow.');
}

function toggleToday(id) {
  const t = findTask(id);
  if (!t) return;
  if (!t.today && L().tasks.filter(x => x.today && !x.done).length >= TODAY_LIMIT) {
    toast(`Today is capped at ${TODAY_LIMIT}. Finish or unpick one first. Fewer picks means you actually finish them.`, true);
    return;
  }
  pushUndoSnapshot((t.today ? 'unpick ' : 'pick ') + '"' + t.title + '"');
  t.today = !t.today;
  save();
  renderAll();
}

function updateField(id, field, value) {
  const t = findTask(id);
  if (!t) return;
  t[field] = value;
  save();
}

function renameTask(id, input) {
  const t = findTask(id);
  if (!t) return;
  const v = input.value.trim();
  if (!v) { input.value = t.title; return; }
  t.title = v;
  save();
}

function setFieldAndRender(id, field, value) {
  const t = findTask(id);
  if (!t) return;
  t[field] = t[field] === value ? null : value;
  save();
  renderTaskList();
  renderPickPool();
}

// ── Steps ───────────────────────────────────────────
// A loop can have a checklist in `steps` ([{id, text, done}]).
// `step` stays as a copy of the next unchecked step, so data from
// before steps existed (and older copies of the app on another
// device) still show the right thing. Change steps only through
// setSteps() so the two never drift apart.

function getSteps(t) {
  if (!Array.isArray(t.steps)) return t.step ? [{ id: 'first', text: t.step, done: false }] : [];
  const steps = t.steps.map(x => Object.assign({}, x));
  // An older copy of the app may have changed `step` on its own
  const cur = steps.find(x => !x.done);
  if (t.step && !(cur && cur.text === t.step)) {
    if (cur) cur.text = t.step; else steps.push({ id: 'first', text: t.step, done: false });
  }
  return steps;
}

function currentStep(t) { return getSteps(t).find(x => !x.done) || null; }

function setSteps(t, steps) {
  t.steps = steps.filter(x => x.text && x.text.trim())
    .map(x => {
      const o = { id: x.id && x.id !== 'first' ? x.id : uid(), text: x.text.trim(), done: !!x.done };
      if (o.done && typeof x.doneAt === 'number') o.doneAt = x.doneAt;
      return o;
    });
  const cur = t.steps.find(x => !x.done);
  t.step = cur ? cur.text : '';
}

const newSteps = texts => texts.map(x => (x || '').trim()).filter(Boolean).map(text => ({ id: uid(), text, done: false }));

function toggleStep(id, sid) {
  const t = findTask(id);
  if (!t) return;
  const steps = getSteps(t);
  const st = steps.find(x => x.id === sid);
  if (!st) return;
  pushUndoSnapshot((st.done ? 'uncheck "' : 'check off "') + st.text + '"');
  st.done = !st.done;
  st.doneAt = st.done ? Date.now() : undefined;
  setSteps(t, steps);
  save();
  if (st.done) chime(660, 0.1);
  renderAll();
  if (st.done && steps.every(x => x.done)) askCloseLoop(id);
}

function askCloseLoop(id) {
  const t = findTask(id);
  if (!t || t.done) return;
  openModal(`<h3>That was the last step</h3>
    <p class="hint">${esc(t.title)}. Close the loop?</p>
    <div class="row" style="margin-top:12px;justify-content:flex-end">
      <button class="btn" onclick="closeModal();if(_editing)renderEditor()">Not yet</button>
      <button class="btn primary" onclick="closeModal();closeLoopFromSteps('${t.id}')">Close it</button>
    </div>`);
}

function closeLoopFromSteps(id) {
  if (state.timer && state.timer.taskId === id) finishFocus(true);
  else { if (focusId === id) focusId = null; completeTask(id); }
}

function addStep(id, input) {
  const t = findTask(id);
  const v = input.value.trim();
  if (!t || !v) return;
  const steps = getSteps(t);
  steps.push({ id: uid(), text: v, done: false });
  setSteps(t, steps);
  save();
  input.value = '';
  renderAll();
  document.getElementById('add-step-' + id)?.focus();
}

function editStep(id, sid, input) {
  const t = findTask(id);
  if (!t) return;
  const steps = getSteps(t);
  const st = steps.find(x => x.id === sid);
  if (!st) return;
  const v = input.value.trim();
  if (!v) { input.value = st.text; return; }
  st.text = v;
  setSteps(t, steps);
  save();
}

function removeStep(id, sid) {
  const t = findTask(id);
  if (!t) return;
  const steps = getSteps(t);
  const st = steps.find(x => x.id === sid);
  if (!st) return;
  pushUndoSnapshot('remove step "' + st.text + '"');
  setSteps(t, steps.filter(x => x !== st));
  save();
  renderAll();
}

// Puts a step in front of the remaining ones, so it's the one that shows next
function insertNextStep(id, text) {
  const t = findTask(id);
  text = (text || '').trim();
  if (!t || !text) return;
  const steps = getSteps(t);
  const i = steps.findIndex(x => !x.done);
  if (i >= 0 && steps[i].text === text) return;
  steps.splice(i >= 0 ? i : steps.length, 0, { id: uid(), text, done: false });
  setSteps(t, steps);
  save();
}

const _openSteps = new Set();

function toggleStepsOpen(id) {
  if (_openSteps.has(id)) {
    _openSteps.delete(id);
    if (focusId === id && !state.timer) focusId = null;
  } else {
    _openSteps.add(id);
    if (!state.timer) focusId = id; // the timer button starts on the note you opened last
  }
  renderTaskList();
  renderFocus();
}

function startLoop(id) { goFocus(id, true); }
